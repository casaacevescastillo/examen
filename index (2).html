// Clear zone of corales-overlay.png: for every 8px row (source pixels, top to bottom), half the width of the transparent
// center that is free of coral in that row AND every row above it. Measured from the PNG's alpha channel.
const CORAL_SRC_W = 2172, CORAL_SRC_H = 724, CORAL_ROW = 8;
const CORAL_HALF_CLEAR = [1086,1086,908,900,895,894,894,894,894,877,872,870,870,870,870,870,843,835,832,832,799,787,786,786,786,786,786,786,786,786,786,786,786,693,690,655,651,651,651,651,622,620,605,601,601,601,601,601,601,601,601,601,601,588,582,579,579,579,532,524,522,522,522,497,466,459,457,457,447,409,403,401,400,373,365,357,354,354,315,281,256,225,188,150,17,0,0,0,0,0,0];

function coralPad(coralW, cardW, gap = 24) {
  const s = coralW / CORAL_SRC_W, need = (cardW / 2 + gap) / s; let yb = 0;
  for (let i = 0; i < CORAL_HALF_CLEAR.length; i++) { if (CORAL_HALF_CLEAR[i] >= need) yb = i * CORAL_ROW; else break; }
  return Math.ceil((CORAL_SRC_H - yb) * s + gap);
}

    return () => { window.removeEventListener('resize', fit); window.removeEventListener('orientationchange', fit); ro && ro.disconnect(); };

    let best = 0, run = 0; res.forEach(r => { run = r.ok ? run + 1 : 0; best = Math.max(best, run); });
    const summary = finishSession(n, { cfg, results: res, len: 3, best, retryWins: res.filter(r => !r.ok).length }, res.length >= 3);
    // An unfinished challenge-list session of this same mission (saved before the pilot) is superseded by finishing the path.
    if (n.activeSession && n.activeSession.cfg && isShellPath(n.activeSession.cfg.subject, n.activeSession.cfg.mode === 'mission' && n.activeSession.cfg.mission)) n.activeSession = null;
    dataRef.current = n; setData(n); setSum(summary); setScreen('summary');
  };
  const go = s => { if (s.startsWith('brain:') || s === 'brain') { setBaView(s.split(':')[1] || 'hub'); setScreen('brain'); return; } if (s.startsWith('music')) { setMusicView(s.split(':')[1] || 'start'); setScreen('music'); } else if (s.startsWith('banquet')) { setBqView(s.split(':').slice(1).join(':') || 'hub'); setScreen('banquet'); } else setScreen(s); };
  const prepare = cfg => { const s = createSession(cfg, dataRef.current); sessRef.current = s; setPending(s); setScreen('worldintro'); };
  // The open session (its challenges, position and answers) is saved with the progress, so leaving or
  // reloading never loses it. Answers are only counted once: results[idx] exists = already counted.
  const snap = (s, c) => clone({ cfg: s.cfg, fixed: s.fixed || null, pool: s.pool, idx: s.idx, len: s.len, used: s.used, subjUsed: s.subjUsed, results: s.results, streak: s.streak, best: s.best, retryWins: s.retryWins, familyUsed: s.familyUsed, levelMin: s.levelMin || 0, lessoned: s.lessoned || null, cur: c, at: Date.now() });
  const keepSession = (s, c, extra) => setData(d => { const n = extra ? extra(clone(d)) : clone(d); n.activeSession = snap(s, c); dataRef.current = n; return n; });
  const startFromIntro = () => { const s = sessRef.current; const D = clone(dataRef.current); const n = nextQuestion(D, s, ctx); setCur(n); keepSession(s, n); setScreen('play'); };
  const resumeSession = () => {
    const a = dataRef.current.activeSession; if (!a) return;
    if (a.cfg && a.cfg.mode === 'mission' && isShellPath(a.cfg.subject, a.cfg.mission)) { setScreen('shellintro'); return; }
    if (a.cfg && a.cfg.mode === 'mission' && isBottle(a.cfg.subject, a.cfg.mission)) { setScreen('bottleintro'); return; }
    const s = Object.assign(createSession(a.cfg, dataRef.current), a); delete s.cur; delete s.at; if (!s.fixed) delete s.fixed;
    sessRef.current = s;
    if (s.results.length > s.idx) { s.idx = s.results.length; if (s.idx >= s.len) { finish(true); return; } const n = nextQuestion(dataRef.current, s, ctx); setCur(n); keepSession(s, n); }
    else setCur(a.cur);
    setScreen('play');
  };
  // «El mensaje en la botella» (bottle.js): 3 parts; part 3 records both skills, so 4 answers count for the parents' report.
  const finishBottle = recs => {
    const n = clone(dataRef.current); const cfg = { mode: 'mission', subject: 'eng', mission: 3 };
    recs.forEach((r, k) => recordAnswer(n, { topic: r.topic, s: 'eng', key: 'bottle-' + k }, r.ok));
    const res = recs.length >= 4 ? [recs[0], recs[1], { ok: recs[2].ok && recs[3].ok, s: 'eng', topic: 'eng_sentence' }] : recs;
    let best = 0, run = 0; res.forEach(r => { run = r.ok ? run + 1 : 0; best = Math.max(best, run); });
    const summary = finishSession(n, { cfg, results: res, len: 3, best, retryWins: res.filter(r => !r.ok).length }, recs.length >= 4);
    const a = n.activeSession; if (a && a.cfg && a.cfg.mode === 'mission' && isBottle(a.cfg.subject, a.cfg.mission)) n.activeSession = null;
    dataRef.current = n; setData(n); setSum(summary); setScreen('summary');
  };
  const onFirst = ok => {
    const s = sessRef.current; const q = cur.q;
    if (s.results.length > s.idx) return; // already counted (e.g. after resuming on this challenge)
    s.results.push({ ok, s: q.s, topic: q.topic });
    if (ok) { s.streak++; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
    keepSession(s, cur, n => { recordAnswer(n, q, ok); return n; });
  };
  const finish = complete => {
    const s = sessRef.current; const n = clone(dataRef.current); const summary = finishSession(n, s, complete); n.activeSession = null;
    dataRef.current = n; setData(n); setSum(summary); setScreen('summary');
  };
  const onDone = info => {
    const s = sessRef.current; if (info.retry) s.retryWins++;
    s.idx++;
    if (s.idx >= s.len) { finish(true); return; }
    const n = nextQuestion(dataRef.current, s, ctx); setCur(n); keepSession(s, n);
  };
  const onQuit = () => { const s = sessRef.current; if (s && s.cfg.mode === 'mission') openMissions(s.cfg.subject); else go('map'); };
  const sameAsActive = cfg => { const a = dataRef.current.activeSession; return a && a.cfg.mode === cfg.mode && a.cfg.subject === cfg.subject && a.cfg.mission === cfg.mission && (cfg.mode === 'mission' || cfg.mode === 'final'); };
  const familyOk = () => { const s = sessRef.current; if (s.familyUsed || Math.random() > 0.6) return false; s.familyUsed = true; return true; };
  const startContinue = () => { const D = dataRef.current; if (D.activeSession) { resumeSession(); return; } const a = nextAdventure(D); if (a.kind === 'world') startMission(a.sid, a.mission || nextMissionOf(D, a.sid) || 1); else if (a.kind === 'final') prepare({ mode: 'final' }); else if (a.kind === 'review') prepare({ mode: 'review', topics: weakTopics(D, 5), len: 8 }); else prepare({ mode: 'daily', len: 8 }); };
  const pickTheme = k => { const c = themeCtx(k || data.theme); setCtx(c); setData(d => Object.assign({}, d, k ? { theme: k, themeDay: todayKey() } : { themeDay: todayKey() })); setScreen('map'); };
  let body;
  if (screen === 'home') body = html`<${Home} data=${data} go=${go} stored=${stored} saveFail=${saveFail} setData=${setData}/>`;
  else if (screen === 'intro') body = html`<${Intro} go=${go} setData=${setData}/>`;
  else if (screen === 'checkin') body = html`<${Checkin} onPick=${pickTheme} onBack=${() => go('map')}/>`;
  else if (screen === 'map') body = html`<${MapScreen} data=${data} go=${go} startWorld=${openMissions} startDaily=${() => prepare({ mode: 'daily', len: 8 })} startFinal=${() => prepare({ mode: 'final' })} startContinue=${startContinue}/>`;
  else if (screen === 'worldintro' && pending) body = html`<${WorldIntro} sess=${pending} ctx=${ctx} data=${data} onGo=${startFromIntro} onBack=${() => pending.cfg.mode === 'mission' ? openMissions(pending.cfg.subject) : go(pending.cfg.mode === 'custom' || pending.cfg.mode === 'diag' || pending.cfg.mode === 'review' ? 'parent' : 'map')}/>`;
  else if (screen === 'missions' && wmSid) body = html`<${WorldMissions} data=${data} sid=${wmSid} onStart=${n => startMission(wmSid, n)} go=${go}/>`;
  else if (screen === 'play' && cur) body = html`<${Play} sess=${sessRef.current} cur=${cur} onFirst=${onFirst} onDone=${onDone} onQuit=${onQuit} familyOk=${familyOk} saving=${stored && !saveFail} onLessonDone=${() => { const c = Object.assign({}, cur, { lesson: null }); setCur(c); keepSession(sessRef.current, c); }}/>`;
  else if (screen === 'shellintro') body = html`<${ShellPathIntro} onBack=${() => openMissions('math')} onGo=${() => setScreen('shellpath')}/>`;
  else if (screen === 'shellpath') body = html`<${ShellPathMission} data=${data} onFinish=${finishShellPath} onExit=${() => openMissions('math')}/>`;
  else if (screen === 'bottleintro') body = html`<${BottleIntro} onBack=${() => openMissions('eng')} onGo=${() => setScreen('bottle')}/>`;
  else if (screen === 'bottle') body = html`<${BottleMission} onFinish=${finishBottle} onExit=${() => openMissions('eng')}/>`;
  else if (screen === 'summary' && sum) body = html`<${Summary} sum=${sum} data=${data} onContinue=${startContinue} onMap=${() => go('map')} onHome=${() => go('home')} onCert=${() => go('certificate')} onMissions=${() => openMissions(sum.subject)}/>`;
  else if (screen === 'collection') body = html`<${Collection} data=${data} go=${go}/>`;
  else if (screen === 'gate') body = html`<${Gate} go=${go}/>`;
  else if (screen === 'parent') body = html`<${Parent} data=${data} setData=${setData} go=${go} startCfg=${prepare} stored=${stored} saveFail=${saveFail}/>`;
  else if (screen === 'music') body = html`<${MusicWorld} key=${musicView} data=${data} setData=${setData} go=${go} startView=${musicView}/>`;
  else if (screen === 'banquet') body = html`<${BanquetWorld} key=${bqView} view=${bqView} data=${data} setData=${setData} go=${go}/>`;
  else if (screen === 'brain') body = html`<${BrainAcademy} key=${baView} view=${baView} go=${go}/>`;
  else if (screen === 'braingate') body = html`<${Gate} go=${t => go(t === 'parent' ? 'brain:parent' : 'brain:hub')}/>`;
  else if (screen === 'art') body = html`<${ArtStudio} data=${data} setData=${setData} go=${go}/>`;
  else if (screen === 'certificate') body = html`<${Certificate} data=${data} go=${go}/>`;
  else body = html`<${Home} data=${data} go=${go} stored=${stored} saveFail=${saveFail} setData=${setData}/>`;
  // Background by purpose. 'scenic' (story, intros, rewards): the reef image. 'gameplay' (answering challenges):
  // the original striped ocean with rising bubbles. 'studio' (painting / music tools): striped ocean, no bubbles.
  // Reward screens (summary, certificate, banquet result) paint the reef with their own RewardBackdrop.
  const scenic = screen === 'home' || screen === 'intro' || (screen === 'worldintro' && pending) || screen === 'shellintro' || screen === 'bottleintro' || (screen === 'banquet' && bqView.startsWith('intro'));
  const studio = screen === 'art' || screen === 'music';
  const variant = scenic ? 'scenic' : studio ? 'studio' : 'gameplay';
  return html`<div className=${'app bg-' + variant + (studio ? ' focus' : '') + (scenic ? ' home-app' : '')} style=${{ '--sat': 0.6 + data.pearls.length * 0.08 }}>${variant === 'gameplay' ? html`<${Bubbles}/>` : null}${body}</div>`;
}

/* ================= EL TALLER SECRETO DEL ARTISTA ================= */
const GALLERY_KEY = 'perlas-galeria-v1';
const SESSION_ART = []; // paintings that could not be stored permanently
const ART_STATE = { dirty: false };
// Warn before closing/reloading the page while a painting has unsaved strokes.
try { window.addEventListener('beforeunload', e => { if (ART_STATE.dirty) { e.preventDefault(); e.returnValue = ''; } }); } catch (e) { }
function loadGallery() { try { const r = localStorage.getItem(GALLERY_KEY); return r ? JSON.parse(r) : []; } catch (e) { return []; } }
// Paintings share the browser's ~5 MB storage with Diego's progress. Cap the gallery so it can never
// starve the main save; over the cap a painting stays "solo en esta sesión" (existing message).
const GALLERY_MAX_CHARS = 3000000;
// Editable paint layers (transparent PNG of the strokes) live in IndexedDB, keyed by artwork id, so the
// localStorage gallery keeps its exact shape and size. Older artworks have no layer: they reopen from
// their flattened picture and can be painted over.
const LAYER_DB = 'perlas-arte-v1', LAYER_STORE = 'layers', IMG_STORE = 'images';
const SESSION_LAYERS = {}; const SESSION_IMGS = {};
// Version 2 adds an "images" store: new paintings keep their picture there (much more room than the
// browser's small local storage, which is what forced "solo en esta sesión" before). Version 1 data stays.
function layerDB() { return new Promise((res, rej) => { try { const r = indexedDB.open(LAYER_DB, 2); r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains(LAYER_STORE)) db.createObjectStore(LAYER_STORE); if (!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); } catch (e) { rej(e); } }); }
function idbOp(store, mode, fn) { return layerDB().then(db => new Promise((res, rej) => { const tx = db.transaction(store, mode); const st = tx.objectStore(store); const req = fn(st); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); })); }
const layerOp = (mode, fn) => idbOp(LAYER_STORE, mode, fn);
const layerGet = id => SESSION_LAYERS[id] ? Promise.resolve(SESSION_LAYERS[id]) : layerOp('readonly', st => st.get(id)).catch(() => null);
const layerPut = (id, png) => layerOp('readwrite', st => st.put(png, id)).then(() => true, () => { SESSION_LAYERS[id] = png; return false; });
const layerDel = id => { delete SESSION_LAYERS[id]; return layerOp('readwrite', st => st.delete(id)).catch(() => null); };
const imgGet = id => SESSION_IMGS[id] ? Promise.resolve(SESSION_IMGS[id]) : idbOp(IMG_STORE, 'readonly', st => st.get(id)).catch(() => null);
const imgPut = (id, src) => idbOp(IMG_STORE, 'readwrite', st => st.put(src, id)).then(() => true, () => false);
const imgDel = id => idbOp(IMG_STORE, 'readwrite', st => st.delete(id)).catch(() => null);
const DRAFT_ID = '__draft__';
// The picture of an artwork: inline (older paintings) or in IndexedDB (new ones).
const artImg = item => item.img ? Promise.resolve(item.img) : imgGet(item.id);
// Saves an artwork entry: picture in IndexedDB, small record in the gallery list. Falls back to the old
// inline storage, and only then to this session. Returns 'idb' | 'inline' | false.
async function storeArtwork(item, replaceId) {
  const list = loadGallery(); const k = replaceId ? list.findIndex(x => x.id === replaceId) : -1;
  const place = rec => { const nl = list.slice(); if (k >= 0) nl[k] = rec; else nl.unshift(rec); return saveGallery(nl); };
  if (await imgPut(item.id, item.img)) { const rec = Object.assign({}, item, { img: null, stored: 'idb' }); if (place(rec)) return 'idb'; imgDel(item.id); }
  const rec = Object.assign({}, item); delete rec.stored; if (place(rec)) return 'inline';
  return false;
}
// Backup helpers: every artwork with its picture and editable layer, and the way back in (no duplicates by id).
async function exportArt() {
  const items = loadGallery().concat(SESSION_ART.filter(s => !loadGallery().some(x => x.id === s.id)));
  const out = [];
  for (const it of items) { const r = Object.assign({}, it); r.img = await artImg(it) || null; r.layer = await layerGet(it.id) || null; delete r.stored; delete r.persisted; out.push(r); }
  return out;
}
async function importArt(items) {
  const have = new Set(loadGallery().map(x => x.id)); const res = { added: 0, skipped: 0, failed: 0 };
  for (const it of (items || []).slice().reverse()) {
    if (!it || !it.id || typeof it.img !== 'string' || !it.img.startsWith('data:image/')) { res.failed++; continue; }
    if (have.has(it.id)) { res.skipped++; continue; }
    const rec = Object.assign({}, it); const layer = rec.layer; delete rec.layer; delete rec.stored; delete rec.persisted;
    if (!await storeArtwork(rec)) { res.failed++; continue; }
    if (typeof layer === 'string' && layer.startsWith('data:image/')) await layerPut(rec.id, layer);
    const k = SESSION_ART.findIndex(x => x.id === rec.id); if (k >= 0) SESSION_ART.splice(k, 1);
    have.add(rec.id); res.added++;
  }
  return res;
}
const loadImage = src => new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
function saveGallery(list) { try { const s = JSON.stringify(list); if (s.length > GALLERY_MAX_CHARS) return false; localStorage.setItem(GALLERY_KEY, s); return true; } catch (e) { return false; } }

/* ---------- Transport: look-ahead scheduler (one at a time) ---------- */
const Transport = (() => {
  let timer = null, step = 0, nextT = 0, cfg = null, uiTimers = [];
  function stop() { if (timer) clearInterval(timer); timer = null; uiTimers.forEach(clearTimeout); uiTimers = []; const c = cfg; cfg = null; if (c && c.onStop) c.onStop(); }
  function start(opts) {
    stop(); const c = AudioEng.ensure(); cfg = opts; step = opts.startStep || 0; nextT = (c ? c.currentTime : 0) + 0.08;
    const tick = () => {
      if (!cfg) return; const ac = AudioEng.ensure(); const now = ac ? ac.currentTime : performance.now() / 1000;
      while (cfg && nextT < now + 0.12) {
        if (step >= cfg.len) { if (cfg.loop) step = 0; else { const end = cfg.onEnd, delay = Math.max(0, nextT - now) * 1000; cfg = null; clearInterval(timer); timer = null; uiTimers.push(setTimeout(() => end && end(), delay)); return; } }
        const s = step, t = nextT;
        if (cfg.sched) cfg.sched(s, t);
        if (cfg.onStep) { const cb = cfg.onStep; uiTimers.push(setTimeout(() => cb(s), Math.max(0, (t - now) * 1000))); if (uiTimers.length > 64) uiTimers = uiTimers.slice(-32); }
        nextT += 60 / cfg.getBpm() * (cfg.beats || 0.5); step++;
      }
    };
    if (!c) { cfg.fallback = true; }
    timer = setInterval(tick, 25); tick();
  }
  return { start, stop, playing: () => !!cfg };
})();

  else if (stage === 1) body = html`<div><${Say} who="captain">Copy my rhythm!<//><${FollowRhythm} level=${2} rounds=${1} compact=${true} rec=${() => { }} onDone=${() => { upd(m => { m.rhythm.follow++; }); next(); }}/></div>`;

    ${mcBtns(FAMILIES.map(f => f.id), f => FAM_BY[f].name, inst.fam, () => { playPhrase(inst.id); upd(m => { m.fam[inst.fam][0]++; m.fam[inst.fam][1]++; }); })}${okBar(FAM_BY[inst.fam].why)}</div>`;

  else if (stage === 4) body = html`<div><${Say} who="captain">Conductor, start the orchestra! Press Play.<//><${Sequencer} init=${PRESETS['Rainbow Food Parade']} compact=${true} onPlay=${() => setPlayed(true)}/>

/* ---------- My Music Studio ---------- */
const PADS = [['drum', 'Big drum', '#e8352b'], ['snare', 'Snare', '#ff8a5c'], ['hihat', 'Hi-hat', '#ffc531'], ['tom', 'Tom', '#8f6bff'], ['tambourine', 'Tambourine', '#1cc6c4'], ['maracas', 'Maracas', '#ff6f91']];

const XCOL = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1cc6c4', '#1e88e5', '#8e24aa', '#e53935'];
function MusicStudio({ mus, upd }) {

  const startRec = () => { recRef.current = []; t0.current = performance.now(); setRecording(true); setRec(null); };

  const playRec = r => { const c = AudioEng.ensure(); if (!c || !r) return; Transport.stop(); const base = c.currentTime + 0.1; r.forEach(([ms, inst, m]) => AudioEng.play(inst, base + ms / 1000 / speed, m)); };
  const saveRec = () => { upd(m => { m.saved = [{ id: 'r' + Date.now(), name: 'My jam ' + (m.saved.length + 1), date: new Date().toISOString(), rec }].concat(m.saved).slice(0, 60); }); setMsg((storageOK() ? 'Saved in your song list!' : NOSAVE_EN)); };

    ${tab === 'maracas' ? html`<div className="mara"><button className=${'mara-btn' + (hit === 'm' ? ' hit' : '')} onPointerDown=${e => { e.preventDefault(); note('maracas', undefined, 'm'); }}><${InstSvg} id="maracas" size=${150}/><span>Tap to shake!</span></button>
      <div className="row-btns">${[['Shake-shake', [0, 0.2]], ['Cha-cha-cha', [0, 0.18, 0.36]], ['Long shake', [0, 0.1, 0.2, 0.3, 0.4]]].map(([l, ts]) => html`<button key=${l} className="btn ghost" onClick=${() => { const c = AudioEng.ensure(); if (!c) return; ts.forEach(dt => AudioEng.play('maracas', c.currentTime + 0.05 + dt)); flash('m'); if (recording) ts.forEach(dt => recRef.current.push([performance.now() - t0.current + dt * 1000, 'maracas'])); }}>${l}</button>`)}</div></div>` : null}

      onSaveCopy=${loadSong ? song => { upd(m => { m.saved = [{ id: 's' + Date.now(), name: loadSong.name + ' (copy)', date: new Date().toISOString(), song }].concat(m.saved).slice(0, 60); }); setMsg((storageOK() ? 'A new copy is saved in My Songs.' : NOSAVE_EN)); } : null}/>` : null}

    ${msg ? html`<div className="yay"><strong>${msg}</strong><span className="tip">${storageOK() ? 'Saved on this device.' : 'This browser cannot save, so it will disappear when you close the page.'}</span></div>` : null}
  </div>`;

/* ================= El Banquete Secreto del Arrecife (bonus, Spanish) =================
   Plato del Bien Comer: three groups. One configurable challenge engine drives the five challenges. */
const BQ_GROUPS = [
  { id: 'vf', name: 'Verduras y frutas', con: 'con las verduras y frutas', es: 'es de las verduras y frutas', color: '#2fae6d' },
  { id: 'c', name: 'Cereales', con: 'con los cereales', es: 'es de los cereales', color: '#f5a300' },
  { id: 'la', name: 'Leguminosas y alimentos de origen animal', con: 'con las leguminosas y alimentos de origen animal', es: 'es de las leguminosas y alimentos de origen animal', color: '#e8524a' },
];
const BQ_G = Object.fromEntries(BQ_GROUPS.map(g => [g.id, g]));
// [id, label, article form, plural, emoji (same icon style as the rest of the game), group]
const BQ_FOODS = [
  ['manzana', 'Manzana', 'La manzana', 0, '🍎', 'vf'], ['zanahoria', 'Zanahoria', 'La zanahoria', 0, '🥕', 'vf'], ['platano', 'Plátano', 'El plátano', 0, '🍌', 'vf'],
  ['brocoli', 'Brócoli', 'El brócoli', 0, '🥦', 'vf'], ['mango', 'Mango', 'El mango', 0, '🥭', 'vf'], ['jitomate', 'Jitomate', 'El jitomate', 0, '🍅', 'vf'],
  ['sandia', 'Sandía', 'La sandía', 0, '🍉', 'vf'], ['naranja', 'Naranja', 'La naranja', 0, '🍊', 'vf'], ['lechuga', 'Lechuga', 'La lechuga', 0, '🥬', 'vf'],
  ['tortilla', 'Tortilla', 'La tortilla', 0, '🫓', 'c'], ['arroz', 'Arroz', 'El arroz', 0, '🍚', 'c'], ['pan', 'Pan', 'El pan', 0, '🍞', 'c'],
  ['avena', 'Avena', 'La avena', 0, '🥣', 'c'], ['pasta', 'Pasta', 'La pasta', 0, '🍝', 'c'],
  ['frijoles', 'Frijoles', 'Los frijoles', 1, '🫘', 'la'], ['huevo', 'Huevo', 'El huevo', 0, '🥚', 'la'], ['pescado', 'Pescado', 'El pescado', 0, '🐟', 'la'],
  ['pollo', 'Pollo', 'El pollo', 0, '🍗', 'la'], ['leche', 'Leche', 'La leche', 0, '🥛', 'la'], ['queso', 'Queso', 'El queso', 0, '🧀', 'la'],
].map(([id, n, art, pl, e, g]) => ({ id, n, art, pl, e, g }));
const bqOf = g => BQ_FOODS.filter(f => f.g === g);
const bqVa = f => f.pl ? 'van' : 'va';
const bqEs = f => f.pl ? BQ_G[f.g].es.replace(/^es /, 'son ') : BQ_G[f.g].es;
const BQ_LOWER = s => s.charAt(0).toLowerCase() + s.slice(1);

/* ---- Round generators. A round has `units`: how many points it is worth. ---- */
function bqClassify(n) { // n foods, spread over the three groups
  const per = [0, 0, 0]; for (let i = 0; i < n; i++) per[i % 3]++;
  const foods = shuffle(BQ_GROUPS.flatMap((g, i) => sample(bqOf(g.id), per[i])));
  return { type: 'classify', foods, units: foods.length };
}
function bqOdd() {
  const [main, other] = sample(BQ_GROUPS, 2); const odd = pick(bqOf(other.id));
  return { type: 'odd', main: main.id, odd, opts: shuffle(sample(bqOf(main.id), 3).concat([odd])), units: 1 };
}
function bqPlate() { return { type: 'plate', opts: shuffle(BQ_GROUPS.flatMap(g => sample(bqOf(g.id), 2))), units: 1 }; }
function bqMissing() {
  const miss = pick(BQ_GROUPS); const have = BQ_GROUPS.filter(g => g !== miss);
  const meal = have.map(g => pick(bqOf(g.id)));
  const right = pick(bqOf(miss.id)); const wrong = have.map(g => pick(bqOf(g.id).filter(f => !meal.includes(f))));
  return { type: 'missing', miss: miss.id, meal, right, opts: shuffle([right].concat(wrong)), units: 1 };
}
const BQ_CHALLENGES = [
  { n: 1, t: '¿Dónde va cada alimento?', reward: 'seastar', make: () => [bqClassify(6)],
    intro: 'Hay seis alimentos en la mesa del banquete. Toca uno y luego toca su grupo del Plato del Bien Comer.', info: '6 alimentos · conoces a un nuevo amigo al terminar' },
  { n: 2, t: 'Detectives de alimentos', reward: 'puffer', make: () => [bqOdd(), bqOdd(), bqOdd(), bqOdd(), bqOdd()],
    intro: 'En cada grupo de alimentos hay uno que es de otro grupo. ¿Lo encuentras?', info: '5 grupos de alimentos · conoces a un nuevo amigo al terminar' },
  { n: 3, t: 'Un plato variado', reward: 'squid', plate: true, make: () => [bqPlate(), bqPlate(), bqPlate()],
    intro: 'Arma tres platos variados. Cada plato lleva un alimento de cada grupo.', info: '3 platos · conoces a un nuevo amigo al terminar' },
  { n: 4, t: 'El menú misterioso', reward: 'lobster', make: () => [bqMissing(), bqMissing(), bqMissing(), bqMissing(), bqMissing()],
    intro: 'A estos menús les falta un grupo. ¿Qué le agregas para que tengan los tres?', info: '5 menús · conoces a un nuevo amigo al terminar' },
  { n: 5, t: '¡El gran banquete del arrecife!', reward: 'barracuda', make: () => shuffle([bqOdd(), bqOdd(), bqPlate(), bqPlate(), bqMissing(), bqMissing(), bqMissing()]).concat([bqClassify(3)]),
    intro: 'El gran repaso: clasifica, busca al diferente, arma platos y completa menús.', info: '10 retos · conoces a un nuevo amigo al terminar' },
];

/* ---- One food tile ---- */
const BqFood = ({ f, sel, done, wrong, onClick, disabled }) => html`<button className=${'bq-food' + (sel ? ' sel' : '') + (done ? ' done' : '') + (wrong ? ' wrong' : '')} onClick=${onClick} disabled=${disabled} aria-pressed=${sel ? 'true' : undefined}>
  <span className="bq-emo" aria-hidden="true">${f.e}</span><span>${f.n}</span></button>`;

/* ---- Round views. Each calls onPoint(firstTry) once per unit, and onDone() when the round is finished. ---- */
function BqClassify({ r, onPoint, onDone, say }) {
  const [sel, setSel] = useState(null); const [placed, setPlaced] = useState({}); const [missed, setMissed] = useState({}); const [bad, setBad] = useState(null);
  const left = r.foods.filter(f => !placed[f.id]);
  const drop = g => {
    if (!sel) { say('try', 'Primero toca un alimento.'); return; }
    if (sel.g === g) {
      const np = Object.assign({}, placed, { [sel.id]: g }); setPlaced(np); onPoint(!missed[sel.id]); setBad(null);
      say('ok', `¡Eso es! ${sel.art} ${bqVa(sel)} ${BQ_G[g].con}.`); setSel(null);
      if (Object.keys(np).length === r.foods.length) onDone();
    } else { setMissed(Object.assign({}, missed, { [sel.id]: true })); setBad(sel.id); say('try', '¡Casi! Inténtalo otra vez.'); }
  };
  return html`<div className="bq-round">
    <div className="bq-pool">${left.length ? left.map(f => html`<${BqFood} key=${f.id} f=${f} sel=${sel === f} wrong=${bad === f.id} onClick=${() => { setSel(f); setBad(null); }}/>`) : null}</div>
    <div className="bq-bins">${BQ_GROUPS.map(g => html`<button key=${g.id} className=${'bq-bin' + (sel ? ' ready' : '')} style=${{ '--gc': g.color }} onClick=${() => drop(g.id)}>
      <strong>${g.name}</strong><span className="bq-in">${r.foods.filter(f => placed[f.id] === g.id).map(f => html`<span key=${f.id} className="bq-mini"><span aria-hidden="true">${f.e}</span> ${f.n}</span>`)}</span></button>`)}</div>
  </div>`;
}
function BqPick({ r, onPoint, onDone, say }) { // odd one out / missing group: choose one food
  const [tries, setTries] = useState(0); const [wrong, setWrong] = useState([]); const [ok, setOk] = useState(null);
  const odd = r.type === 'odd';
  const choose = f => {
    if (ok) return; const right = odd ? f === r.odd : f.g === r.miss;
    if (right) { setOk(f); onPoint(tries === 0);
      say('ok', odd ? `¡Eso es! ${f.art} ${bqEs(f)}. Los demás son de ${BQ_LOWER(BQ_G[r.main].name)}.` : `¡Eso es! Con ${BQ_LOWER(f.art)} el menú ya tiene los tres grupos.`);
      setTimeout(onDone, 1300);
    } else { setTries(tries + 1); setWrong(wrong.concat(f.id)); say('try', '¡Casi! Inténtalo otra vez.'); }
  };
  return html`<div className="bq-round">
    ${odd ? null : html`<div className="bq-meal"><span className="bq-meal-h">El menú tiene:</span>${r.meal.map(f => html`<span key=${f.id} className="bq-mini big"><span aria-hidden="true">${f.e}</span> ${f.n}</span>`)}</div>
      <p className="bq-ask">¿Qué le agregas para que tenga los tres grupos?</p>`}
    <div className="bq-pool opts">${r.opts.map(f => html`<${BqFood} key=${f.id} f=${f} sel=${ok === f} done=${ok === f} wrong=${wrong.includes(f.id)} disabled=${!!ok} onClick=${() => choose(f)}/>`)}</div>
  </div>`;
}
function BqPlate({ r, onPoint, onDone, say }) {
  const [plate, setPlate] = useState([]); const [tries, setTries] = useState(0); const [ok, setOk] = useState(false);
  const toggle = f => { if (ok) return; setPlate(plate.includes(f) ? plate.filter(x => x !== f) : plate.length < 3 ? plate.concat(f) : plate); };
  const check = () => {
    const gs = new Set(plate.map(f => f.g));
    if (gs.size === 3) { setOk(true); onPoint(tries === 0); say('ok', `¡Qué plato tan variado! ${plate.map(f => f.n).join(', ')}: un alimento de cada grupo.`); setTimeout(onDone, 1500); }
    else { setTries(tries + 1); say('try', '¡Casi! Tu plato tiene dos alimentos del mismo grupo. Cambia uno.'); }
  };
  return html`<div className="bq-round">
    <div className="bq-pool">${r.opts.map(f => html`<${BqFood} key=${f.id} f=${f} sel=${plate.includes(f)} done=${ok && plate.includes(f)} disabled=${ok} onClick=${() => toggle(f)}/>`)}</div>
    <div className="bq-plate" aria-live="polite"><span className="bq-meal-h">Mi plato (${plate.length} de 3):</span>${plate.map(f => html`<span key=${f.id} className="bq-mini big"><span aria-hidden="true">${f.e}</span> ${f.n}</span>`)}</div>
    <button className="btn go big" disabled=${plate.length < 3 || ok} onClick=${check}>¡Listo!</button>
  </div>`;
}

/* ---- Challenge runner: rounds from the challenge config, first-try scoring, result + reward ---- */
function BanquetPlay({ ch, data, setData, onExit, onNext, onCollection }) {
  const [rounds, setRounds] = useState(() => ch.make()); const [ri, setRi] = useState(0);
  const [score, setScore] = useState(0); const [units, setUnits] = useState(0); const [msg, setMsg] = useState(null); const [end, setEnd] = useState(null);
  const total = rounds.reduce((n, r) => n + r.units, 0);
  const scoreRef = useRef(0);
  const onPoint = first => { setUnits(u => u + 1); if (first) { scoreRef.current += 1; setScore(scoreRef.current); } };
  const say = (kind, text) => setMsg({ kind, text });
  const onDone = () => {
    if (ri + 1 < rounds.length) { setRi(ri + 1); setMsg(null); return; }
    finish(scoreRef.current);
  };
  const finish = sc => {
    const pass = true; // every challenge is finished only with correct answers (help and retries included) let isNew = false;
    setData(d => { const b = banquetOf(d); const n = Object.assign({}, b, { tries: Object.assign({}, b.tries, { [ch.n]: (b.tries[ch.n] || 0) + 1 }), best: Object.assign({}, b.best, { [ch.n]: Math.max(b.best[ch.n] || 0, sc) }) });
      if (pass) { if (!n.done.includes(ch.n)) n.done = n.done.concat(ch.n); if (!n.creatures.includes(ch.reward)) { n.creatures = n.creatures.concat(ch.reward); isNew = true; } }
      return Object.assign({}, d, { banquet: n }); });
    setEnd({ pass, sc, isNew: pass && !banquetOf(data).creatures.includes(ch.reward) });
  };
  const retry = () => { scoreRef.current = 0; setRounds(ch.make()); setRi(0); setScore(0); setUnits(0); setMsg(null); setEnd(null); };
  const crit = SPECIAL_CREATURES.find(c => c.id === ch.reward);
  if (end && end.pass) return html`<${SpecialReward} creature=${crit} isNew=${end.isNew} score=${end.sc} total=${total} plate=${!!ch.plate}
    nextLabel=${ch.n < 5 ? '¡Siguiente reto!' : '¡Ver mi colección!'} onNext=${ch.n < 5 ? onNext : onCollection} onBack=${onExit}/>`;
  const r = rounds[ri]; const View = r.type === 'classify' ? BqClassify : r.type === 'plate' ? BqPlate : BqPick;
  return html`<div className="screen play bq-play" style=${{ '--wc': '#ff8a5c' }}>
    <div className="topbar"><${NavBtn} icon="back" label="Banquete" onClick=${onExit}/><span className="chip-w">${ch.t}</span><span className="step-label">Reto ${Math.min(units + 1, total)} de ${total}</span></div>
    <div className="panel bq-card">
      <div className="qhead"><div className="qguide"><${Diego} size=${84}/></div><div className="bubble"><p>${r.type === 'classify' ? 'Toca un alimento y luego toca su grupo.' : r.type === 'odd' ? '¿Cuál alimento es de otro grupo?' : r.type === 'plate' ? 'Arma un plato con un alimento de cada grupo.' : '¿Qué grupo le falta a este menú?'}</p>
        <div className="help-row"><${Speak} text=${r.type === 'classify' ? 'Toca un alimento y luego toca su grupo.' : r.type === 'odd' ? 'Cuál alimento es de otro grupo' : r.type === 'plate' ? 'Arma un plato con un alimento de cada grupo.' : 'El menú tiene ' + r.meal.map(f => f.n).join(' y ') + '. Qué le agregas para que tenga los tres grupos'} lang="es"/></div></div></div>
      <${View} key=${ri} r=${r} onPoint=${onPoint} onDone=${onDone} say=${say}/>
      <div className=${'feedback ' + (msg ? (msg.kind === 'ok' ? 'right' : 'try') : '')} aria-live="polite">${msg ? html`<div className="fb-msg"><div><strong>${msg.text}</strong></div></div>` : null}</div>
    </div>
  </div>`;
}

/* ============ PILOT · Bahía de los Números, misión 2: «El camino de las conchas» ============
   Three connected stages (build, the current, the last jump) replace the 8 multiple-choice challenges of
   this one mission. Tap to add a piece, tap a placed piece to take it back. Nothing else uses this file. */
const SP_RAND = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function spStages() {
  const t1 = SP_RAND(2, 4) * 10 + SP_RAND(1, 9);
  let t2; do { t2 = SP_RAND(3, 5) * 10 + SP_RAND(1, 9); } while (t2 === t1);
  const lostTens = SP_RAND(1, 2); const lostUnits = Math.random() < 0.5 ? SP_RAND(1, 3) : 0;
  const u2 = t2 % 10, keepUnits = Math.max(0, u2 - Math.min(lostUnits, u2));
  let t3; do { t3 = SP_RAND(5, 8) * 10 + SP_RAND(2, 9); } while (t3 === t1 || t3 === t2);
  return [
    { kind: 'build', target: t1, start: [0, 0], supply: [5, 12], counter: true },
    { kind: 'current', target: t2, start: [Math.floor(t2 / 10) - lostTens, keepUnits], swept: [lostTens, u2 - keepUnits], supply: [lostTens + 2, 12], counter: true },
    // The last jump: a limited tray (one more ten and two more ones than needed), and no running count.
    { kind: 'jump', target: t3, start: [0, 0], supply: [Math.floor(t3 / 10) + 1, (t3 % 10) + 2], counter: false },
  ];
}
const SP_ASK = [
  t => `Rayito necesita ${t} conchas para el primer tramo.`,

const SP_WIN = ['¡Eso es! ¡Ya tenemos el primer tramo!', '¡Bien hecho! ¡La corriente no pudo con nosotros!', '¡Perfecto! ¡El camino está listo!'];
const spTotal = p => p[0] * 10 + p[1];

function SpStage({ st, n, onWin, onMiss }) {
  const [p, setP] = useState(st.start); const [tries, setTries] = useState(0); const [msg, setMsg] = useState(null); const [won, setWon] = useState(false);
  const [wave, setWave] = useState(st.kind === 'current'); const [showSwept, setShowSwept] = useState(st.kind === 'current');
  useEffect(() => { if (st.kind !== 'current') return; const t1 = setTimeout(() => setShowSwept(false), 1100); const t2 = setTimeout(() => setWave(false), 1900); return () => { clearTimeout(t1); clearTimeout(t2); }; }, []);
  const left = [st.supply[0] - Math.max(0, p[0] - st.start[0]), st.supply[1] - Math.max(0, p[1] - st.start[1])];
  const add = k => { if (won || left[k] <= 0) return; setMsg(null); setP(k ? [p[0], p[1] + 1] : [p[0] + 1, p[1]]); };
  const take = k => { if (won || p[k] <= 0) return; setMsg(null); setP(k ? [p[0], p[1] - 1] : [p[0] - 1, p[1]]); };
  const bundle = () => { if (won || p[1] < 10) return; setP([p[0] + 1, p[1] - 10]); setMsg({ k: 'tip', t: '¡Juntaste 10 sueltas en una decena!' }); };
  const check = () => {
    const tot = spTotal(p);
    if (tot === st.target && p[1] < 10) { setWon(true); setMsg({ k: 'ok', t: SP_WIN[n] }); onWin(tries === 0); return; }
    const nt = tries + 1; setTries(nt); onMiss();
    if (tot === st.target) setMsg({ k: 'try', t: `¡Son ${tot}! Pero 10 sueltas forman una decena. ¡Júntalas!` });
    else if (tot < st.target) setMsg({ k: 'try', t: st.target - tot >= 10 ? '¡Nos falta un buen tramo! ¿Cuántas decenas necesitas?' : '¡Nos falta un poquito! Cuenta las conchas otra vez.' });
    else setMsg({ k: 'try', t: tot - st.target >= 10 ? '¡Hay demasiadas! ¿Quitamos una decena?' : '¡Hay demasiadas! ¿Quitamos algunas?' });
  };
  const fbRef = useRef(null);
  useEffect(() => { if (msg && fbRef.current && fbRef.current.scrollIntoView) { try { fbRef.current.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { } } }, [msg]);
  const T = Math.floor(st.target / 10), U = st.target % 10;
  // Progressive help: after 2 misses, say it in tens and ones; after 3, outline the spots in the build zone.
  const hint = tries >= 2 ? `${st.target} = ${T} ${T === 1 ? 'decena' : 'decenas'} y ${U} ${U === 1 ? 'suelta' : 'sueltas'}` : null;
  const ghosts = tries >= 3;
  return html`<div className=${'sp-stage' + (won ? ' won' : '')}>
    <div className="sp-ask"><strong>${SP_ASK[n](st.target)}</strong>
      <div className="help-row"><${Speak} text=${SP_ASK[n](st.target)} lang="es"/>${st.counter || won ? html`<span className="sp-count" aria-live="polite">Llevas <b>${spTotal(p)}</b></span>` : null}</div></div>
    <div className="sp-zone" aria-label="Zona del camino">
      ${wave ? html`<span className="sp-wave" aria-hidden="true"></span>` : null}
      <div className="sp-col sp-tens"><span className="sp-h">Decenas <b>${p[0]}</b></span>
        <div className="sp-pieces">${Array.from({ length: p[0] }, (_, i) => html`<button key=${'t' + i} className="sp-piece ten" onClick=${() => take(0)} aria-label="Quitar una decena"><${SpRod} size=${16}/></button>`)}
          ${showSwept ? Array.from({ length: st.swept[0] }, (_, i) => html`<span key=${'s' + i} className="sp-piece ten swept" aria-hidden="true"><${SpRod} size=${16}/></span>`) : null}
          ${ghosts ? Array.from({ length: Math.max(0, T - p[0]) }, (_, i) => html`<span key=${'g' + i} className="sp-ghost ten" aria-hidden="true"></span>`) : null}
          ${!p[0] && !ghosts ? html`<span className="sp-empty">Toca + decena</span>` : null}</div></div>
      <div className="sp-col sp-ones"><span className="sp-h">Sueltas <b>${p[1]}</b></span>
        <div className="sp-pieces sp-loose">${Array.from({ length: p[1] }, (_, i) => html`<button key=${'u' + i} className="sp-piece one" onClick=${() => take(1)} aria-label="Quitar una concha"><${ShellIcon} size=${26}/></button>`)}
          ${showSwept ? Array.from({ length: st.swept[1] }, (_, i) => html`<span key=${'v' + i} className="sp-piece one swept" aria-hidden="true"><${ShellIcon} size=${26}/></span>`) : null}
          ${ghosts ? Array.from({ length: Math.max(0, U - p[1]) }, (_, i) => html`<span key=${'h' + i} className="sp-ghost one" aria-hidden="true"></span>`) : null}
          ${!p[1] && !ghosts ? html`<span className="sp-empty">Toca + concha</span>` : null}</div>
        ${p[1] >= 10 && !won ? html`<button className="btn ghost sp-bundle" onClick=${bundle}>Juntar 10 en una decena</button>` : null}</div>
    </div>
    ${won ? null : html`<div className="sp-tray">
      <button className="sp-add" onClick=${() => add(0)} disabled=${left[0] <= 0}><${SpRod} size=${14}/><span>+ decena</span><small>quedan ${left[0]}</small></button>
      <button className="sp-add" onClick=${() => add(1)} disabled=${left[1] <= 0}><${ShellIcon} size=${30}/><span>+ concha</span><small>quedan ${left[1]}</small></button>
      <button className="btn go big sp-check" onClick=${check} disabled=${!spTotal(p)}>¡Listo!</button></div>`}
    ${hint && !won ? html`<p className="sp-hint"><b>Pista de Rayito:</b> ${hint}</p>` : null}
    <div ref=${fbRef} className=${'feedback ' + (msg ? (msg.k === 'ok' ? 'right' : msg.k === 'try' ? 'try' : '') : '')} aria-live="polite">${msg ? html`<div className="fb-msg"><${Guide} id="rayito" size=${64}/><div><strong>${msg.t}</strong></div></div>` : null}</div>
  </div>`;
}

function ShellPathMission({ data, onFinish, onExit }) {

/* ============ Arrecife de las Palabras, misión 3: «El mensaje en la botella» ============
   Three parts of one message. Part 1: put the words in order. Part 2: find and fix the capital letters and the
   end mark. Part 3: both (order the lowercase words, then fix them). Each solved part is written on the message. */
const BT_LINES = ['The pearl is safe.', 'It waits for Diego.', 'Find the names of the reef.'];
const BT_ES = ['¡La perla está a salvo!', '¡Te espera a ti, Diego!', 'Busca los nombres del arrecife.'];
const BT_P1 = { tiles: ['safe.', 'The', 'is', 'pearl'], answer: ['The', 'pearl', 'is', 'safe.'] };
const BT_P2 = { words: ['it', 'waits', 'for', 'diego'], caps: [true, false, false, true], names: [3], mark: '.' };
const BT_P3 = { tiles: ['reef', 'the', 'find', 'of', 'names', 'the'], answer: ['find', 'the', 'names', 'of', 'the', 'reef'],
  fix: { words: ['find', 'the', 'names', 'of', 'the', 'reef'], caps: [true, false, false, false, false, false], names: [], mark: '.' } };
const btCap = (w, on) => on ? w.charAt(0).toUpperCase() + w.slice(1) : w.charAt(0).toLowerCase() + w.slice(1);
const btSay = (t, lang) => { try { speak(t, lang); } catch (e) { } };

function BtListen({ text, label }) {
  if (!CAN_SPEAK) return null;
  return html`<button className="speak" onClick=${() => btSay(text, 'en')} disabled=${!text}><${Icon} n="speaker"/><span>${label}</span></button>`;
}
// The message itself: solved lines in ink, the line being solved holds the activity, later lines are still blurry.
function BtPaper({ done, children, label, fresh = -1 }) {
  return html`<div className="bt-paper" aria-label=${label}>
    ${BT_LINES.map((l, i) => i < done ? html`<p key=${i} className=${'bt-line ink' + (i === fresh ? ' fresh' : '')} lang="en">${l}</p>`
      : i === done && children ? html`<div key=${i} className="bt-line active">${children}</div>`
      : html`<p key=${i} className="bt-line blur" aria-hidden="true"><span></span><span></span><span></span></p>`)}
  </div>`;
}

// Word order: tap a word to put it in the next space; tap a placed word to take it back.
function BtOrder({ part, set, onDone, onMiss, say }) {
  const n = set.answer.length;
  const [slots, setSlots] = useState(() => Array(n).fill(null)); const [tries, setTries] = useState(0);
  const used = slots.filter(s => s !== null);
  const put = ti => { const k = slots.indexOf(null); if (k < 0 || used.includes(ti)) return; const ns = slots.slice(); ns[k] = ti; setSlots(ns); say(null); };
  const back = k => { if (slots[k] === null) return; const ns = slots.slice(); ns[k] = null; setSlots(ns); say(null); };
  const words = slots.map(ti => ti === null ? null : set.tiles[ti]);
  const full = words.every(Boolean);
  const check = () => {
    if (words.join(' ') === set.answer.join(' ')) { onDone(tries === 0); return; }
    setTries(tries + 1); onMiss();
    const first = words[0] !== set.answer[0], last = words[n - 1] !== set.answer[n - 1];
    if (part === 1) say(first ? 'Mmm… ¿qué palabra tiene mayúscula? Esa va primero.' : last ? '¡Casi! La palabra con punto va al final.' : 'Escúchalo. ¿Suena bien? Cambia las palabras del medio.', 'try');
    else say(first ? 'El mensaje nos pide hacer algo. ¿Qué palabra es lo que hay que hacer? Esa va primero.' : 'Escúchalo. ¿Tiene sentido? Mueve las palabras que no encajan.', 'try');
  };
  // Help: after 2 tries a tip; after 3, the right word for the first wrong space glows. Diego still places it.
  const tip = tries >= 2 ? (part === 1 ? 'La palabra con mayúscula va primero y la del punto va al final.' : 'El mensaje empieza con «find». ¿Qué hay que encontrar?') : null;
  const wrongAt = words.findIndex((w, k) => w !== set.answer[k]);
  const glowTi = tries >= 3 && wrongAt >= 0 ? set.tiles.findIndex((t, ti) => t === set.answer[wrongAt] && !used.includes(ti)) : -1;
  return html`<${React.Fragment}>
    <${BtPaper} done=${part - 1} label="Mensaje de la botella"><div className="build tk-word bt-build"><div className="bslots">${words.map((w, k) => html`<button key=${k} className=${'bslot' + (w ? ' filled' : '') + (tries >= 3 && k === wrongAt ? ' bt-here' : '')} onClick=${() => back(k)} aria-label=${w ? 'Quitar ' + w : 'Espacio vacío'} lang="en"><span>${w || ''}</span></button>`)}</div></div><//>
    <div className="build tk-word bt-tray"><div className="tiles">${set.tiles.map((t, ti) => used.includes(ti) ? html`<span key=${ti} className="tile ghost"></span>`
      : html`<button key=${ti} className=${'tile' + (ti === glowTi ? ' bt-glow' : '')} onClick=${() => put(ti)} lang="en">${t}</button>`)}</div></div>
    <div className="bt-actions"><${BtListen} text=${words.filter(Boolean).join(' ')} label="Escucha tu mensaje"/>
      <button className="btn ghost" onClick=${() => { setSlots(Array(n).fill(null)); say(null); }} disabled=${!used.length}>Borrar</button>
      <button className="btn go big bt-check" disabled=${!full} onClick=${check}>¡Listo!</button></div>
    ${tip ? html`<p className="bt-hint"><b>Pista de Coralina:</b> ${tip}</p>` : null}
  <//>`;
}

// Fix the sentence: tap a word to switch its first letter (big / small); tap a mark to end the sentence.
function BtFix({ part, set, onDone, onMiss, say }) {
  const [caps, setCaps] = useState(() => set.words.map(() => false)); const [mark, setMark] = useState(''); const [tries, setTries] = useState(0);
  const toggle = k => {
    const on = !caps[k]; const nc = caps.slice(); nc[k] = on; setCaps(nc);
    const w = btCap(set.words[k], true), isName = set.names.includes(k);
    say(k === 0 ? (on ? '¡Sí! Una oración empieza con mayúscula.' : 'Mmm… ¿con qué letra empieza una oración?')
      : isName ? (on ? `¡Claro! ${w} es un nombre, lleva mayúscula.` : '¡Ups! Los nombres llevan mayúscula.')
      : (on ? `Mmm… «${set.words[k]}» no es un nombre. ¿Lleva mayúscula?` : 'Bien, esa palabra va en minúscula.'), on === set.caps[k] ? 'tip' : 'info');
  };
  const putMark = m => { setMark(m); say(m === '.' ? '¡Un punto! Así termina un mensaje que nos cuenta o nos pide algo.' : '¿Una pregunta? Mmm… ¿el mensaje está preguntando algo?', m === set.mark ? 'tip' : 'info'); };
  const wrong = set.words.map((_, k) => caps[k] !== set.caps[k] ? k : -1).filter(k => k >= 0);
  const markOk = mark === set.mark;
  const check = () => {
    if (!wrong.length && markOk) { onDone(tries === 0); return; }
    setTries(tries + 1); onMiss();
    const left = wrong.length + (markOk ? 0 : 1);
    const where = wrong.includes(0) ? 'Mira cómo empieza.' : wrong.some(k => set.names.includes(k)) ? 'Busca los nombres.' : wrong.length ? 'Alguna palabra no necesita mayúscula.' : !mark ? '¿Cómo termina el mensaje?' : '¿Pregunta algo el mensaje?';
    say(`${left === 1 ? 'Falta 1 cosa por arreglar' : `Faltan ${left} cosas por arreglar`}. ${where}`, 'try');
  };
  const tip = tries >= 2 ? (set.names.length ? 'Revisa tres lugares: el principio, los nombres y el final.' : 'Revisa dos lugares: el principio y el final.') : null;
  const glow = tries >= 3;
  const text = set.words.map((w, k) => btCap(w, caps[k])).join(' ') + mark;
  return html`<${React.Fragment}>
    <${BtPaper} done=${part - 1} label="Mensaje de la botella"><div className="bt-fix" lang="en">
      ${set.words.map((w, k) => html`<button key=${k} className=${'bt-word' + (caps[k] ? ' up' : '') + (glow && wrong.includes(k) ? ' bt-here' : '')} onClick=${() => toggle(k)} aria-label=${'Cambiar mayúscula de ' + w} aria-pressed=${caps[k]}>${btCap(w, caps[k])}</button>`)}
      <button className=${'bt-mark' + (mark ? ' on' : '') + (glow && !markOk ? ' bt-here' : '')} onClick=${() => mark && setMark('')} aria-label=${mark ? 'Quitar el signo' : 'Aquí va el signo final'}>${mark || ''}</button>
    </div><//>
    <div className="bt-marks"><span className="bt-mlabel">Termina con:</span>
      <button className="tile bt-mtile" onClick=${() => putMark('.')} aria-label="Punto">.</button>
      <button className="tile bt-mtile" onClick=${() => putMark('?')} aria-label="Signo de pregunta">?</button></div>
    <div className="bt-actions"><${BtListen} text=${text} label="Escucha tu mensaje"/>
      <button className="btn go big bt-check" onClick=${check}>¡Listo!</button></div>
    ${tip ? html`<p className="bt-hint"><b>Pista de Coralina:</b> ${tip}</p>` : null}
  <//>`;
}

const BT_ASK = {
  1: '¡Las palabras salieron volando de la botella! Ponlas en orden.',
  2: 'Este pedazo está escrito raro… ¡algo no está bien! Toca las palabras y ponle su final.',
  '3a': 'El último pedazo está muy revuelto. Primero, ordena las palabras.',
  '3b': '¡Ya tiene sentido! Pero le faltan detalles. ¿Los arreglas?',
};
const BT_WIN = {
  1: '¡Mira! Las palabras se quedaron en el papel: «The pearl is safe». ¡La perla está a salvo!',
  2: '¡Ahora sí se lee! «It waits for Diego». ¡Diego, el mensaje dice tu nombre!',
  '3a': '¡Bien ordenado! Ahora revisa cómo empieza y cómo termina.',
  3: '¡Perfecto! «Find the names of the reef». ¡Es una pista!',
};

function BottleMission({ onFinish, onExit }) {
  const [part, setPart] = useState(1); const [step, setStep] = useState('a'); const [done, setDone] = useState(0);
  const [msg, setMsg] = useState(null); const [end, setEnd] = useState(false); const [busy, setBusy] = useState(false); const [quit, setQuit] = useState(false);
  const recs = useRef([]); const missed = useRef(false);
  const fbRef = useRef(null);
  useEffect(() => { if (msg && fbRef.current && fbRef.current.scrollIntoView) { try { fbRef.current.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { } } }, [msg]);
  const say = (t, k) => setMsg(t ? { t, k: k || 'info' } : null);
  const rec = (topic, first) => { recs.current = recs.current.concat({ ok: first && !missed.current, s: 'eng', topic }); missed.current = false; };
  const solved = (topic, first, winMsg) => {
    rec(topic, first); setBusy(true); setDone(d => d + 1); say(winMsg, 'ok');
    setTimeout(() => { setBusy(false); say(null); if (part < 3) { setPart(part + 1); setStep('a'); } else setEnd(true); }, 2600);
  };
  const key = part + step;
  let body = null;
  if (!end && !busy) {
    if (part === 1) body = html`<${BtOrder} key=${key} part=${1} set=${BT_P1} say=${say} onMiss=${() => { missed.current = true; }} onDone=${f => solved('eng_sentence', f, BT_WIN[1])}/>`;
    else if (part === 2) body = html`<${BtFix} key=${key} part=${2} set=${BT_P2} say=${say} onMiss=${() => { missed.current = true; }} onDone=${f => solved('eng_punct', f, BT_WIN[2])}/>`;
    else if (step === 'a') body = html`<${BtOrder} key=${key} part=${3} set=${BT_P3} say=${say} onMiss=${() => { missed.current = true; }} onDone=${f => { rec('eng_sentence', f); say(BT_WIN['3a'], 'ok'); setStep('b'); }}/>`;
    else body = html`<${BtFix} key=${key} part=${3} set=${BT_P3.fix} say=${say} onMiss=${() => { missed.current = true; }} onDone=${f => solved('eng_punct', f, BT_WIN[3])}/>`;
  }
  const ask = part === 3 ? BT_ASK['3' + step] : BT_ASK[part];
  const finish = () => onFinish(recs.current);
  return html`<div className="screen play bt-screen" style=${{ '--wc': SUBJ.eng.color }}>
    <div className="topbar"><${NavBtn} icon="back" label="Mapa" onClick=${() => end ? finish() : setQuit(true)}/><span className="chip-w">El mensaje en la botella</span><span className="step-label">${end ? '¡Mensaje completo!' : `Parte ${Math.min(done + 1, 3)} de 3`}</span></div>
    ${quit ? html`<${ConfirmDialog} title="¿Volvemos al mapa?" text="Si sales ahora, el mensaje se revuelve otra vez y la próxima vez empiezas desde el principio." cancelLabel="Seguir jugando" okLabel="Volver al mapa" onCancel=${() => setQuit(false)} onOk=${onExit}/>` : null}
    <div className="panel qcard bt-card">
      ${end ? html`<div className="bt-end" role="status">
          <${BtPaper} done=${3} label="Mensaje completo"/>
          <div className="bt-say"><${Guide} id="coralina" size=${96} cls="bounce"/><p className="m-bubble">¡Lo descubrimos! La perla está a salvo y te espera a ti, Diego. Y la pista dice: busca los nombres del arrecife.</p></div>
          <div className="bt-actions"><${BtListen} text=${BT_LINES.join(' ')} label="Escucha el mensaje"/><button className="btn go big" onClick=${finish}>¡A seguir la pista!</button></div>
        </div>`

/* ================= BRAIN ACADEMY · VOCABULARY CHALLENGE =================

const BA_LESSONS = [

const BA_WORDS = BA_LESSONS.flatMap(l => l.words.map(x => Object.assign({ L: l.n }, x)));
const BA_W = Object.fromEntries(BA_WORDS.map(x => [x.w, x]));
const BA_WRITTEN = { write: 1, meanwrite: 1 };
const BA_KIND_ES = { listen: 'Escuchar y elegir', meaning: 'Significado', build: 'Armar la palabra', write: 'Dictado', meanwrite: 'Significado escrito' };
const BA_ACT = {
  listen: { t: 'Listen & Meaning', s: 'Hear a word or read a meaning. Pick the word.', kinds: ['listen', 'meaning'] },
  build: { t: 'Build the Word', s: 'Hear the word. Build it with the letters.', kinds: ['build'] },

/* ---------- storage: index of players + one key per player ---------- */
const BA_KEY = 'perlas-brain-academy-v1';
const baPKey = id => BA_KEY + ':' + id;
function baIndex() { try { const r = localStorage.getItem(BA_KEY); if (r) { const o = JSON.parse(r); if (o && Array.isArray(o.players) && o.players.length) { if (!o.players.some(p => p.id === o.current)) o.current = o.players[0].id; return o; } } } catch (e) { } return { current: 'diego', players: [{ id: 'diego', name: 'Diego' }] }; }
function baSaveIndex(ix) { try { localStorage.setItem(BA_KEY, JSON.stringify(ix)); return true; } catch (e) { return false; } }
function baFresh() { return { v: 1, words: {}, rounds: [], exams: [], log: [] }; }
function baLoad(id) { try { const r = localStorage.getItem(baPKey(id)); if (r) { const o = JSON.parse(r); return Object.assign(baFresh(), o); } } catch (e) { } return baFresh(); }
function baSave(id, P) { try { if (P.log.length > 3000) P.log = P.log.slice(-3000); localStorage.setItem(baPKey(id), JSON.stringify(P)); return true; } catch (e) { return false; } }
function baWS(P, w) { if (!P.words[w]) P.words[w] = { att: 0, first: 0, firstOK: 0, err: 0, after: 0, afterOK: 0, ev: [], mastered: false, lapses: 0, last: 0 }; return P.words[w]; }
const baStatus = s => !s || !s.att ? 'new' : s.mastered ? 'mastered' : 'practice';
const BA_ST_EN = { new: 'Not yet', practice: 'Practicing', mastered: 'Mastered' };
const BA_ST_ES = { new: 'Sin evaluar', practice: 'En práctica', mastered: 'Dominada' };
const BA_ST_PILL = { new: 'none', practice: 'learning', mastered: 'mastered' };
function baMasteredCount() { try { const P = baLoad(baIndex().current); return BA_WORDS.filter(x => baStatus(P.words[x.w]) === 'mastered').length; } catch (e) { return 0; } }
const baNorm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

/* ---------- recording one answer. ph: 'first' (counts for evidence) | 'retry' | 'review' ----------
   Evidence: a round gives a word one independent success only if every first presentation of that word in the
   round was correct. Mastered = evidence from 3 different rounds, at least one of them written. A first-attempt
   miss on a mastered word sends it back to «En práctica» and clears its evidence. */
function baRecord(P, round, q, answer, ok) {
  const s = baWS(P, q.w); s.att++; s.last = Date.now();
  P.log.push({ t: Date.now(), r: round.id, w: q.w, k: q.k, a: answer, ok, ph: q.ph });
  if (q.ph === 'first') {
    s.first++; if (ok) s.firstOK++; else { s.err++; s.ek = s.ek || {}; s.ek[q.k] = (s.ek[q.k] || 0) + 1; s.lastFail = q.k; }
    s.lastFirst = ok;
    if (round.kind !== 'review') {
      round.rs = round.rs || {}; const rs = round.rs[q.w] = round.rs[q.w] || { ok: true, wr: false };
      if (!ok) rs.ok = false; else if (BA_WRITTEN[q.k]) rs.wr = true;
      if (!ok && s.mastered) { s.mastered = false; s.ev = []; s.lapses++; }
      s.ev = s.ev.filter(e => e.r !== round.id);
      if (rs.ok) s.ev.push({ r: round.id, wr: rs.wr });
      if (!s.mastered && s.ev.length >= 3 && s.ev.some(e => e.wr)) s.mastered = true;
    }
  } else { s.after++; if (ok) s.afterOK++; }
}

/* ---------- building rounds ---------- */
function baSpread(qs) {
  let out = shuffle(qs);
  for (let pass = 0; pass < 6; pass++) {
    let fixed = true;
    for (let i = 1; i < out.length; i++) if (out[i].w === out[i - 1].w) { fixed = false; const j = out.findIndex((x, k) => k > i && x.w !== out[i - 1].w && (!out[k + 1] || out[k + 1].w !== out[i].w)); if (j > 0) [out[i], out[j]] = [out[j], out[i]]; }
    if (fixed) break;
  }
  return out;
}
const baKindFor = k => CAN_SPEAK ? k : k === 'listen' ? 'meaning' : k === 'write' ? 'meanwrite' : k;
function baMakeRound(kind, list, kinds, label) {
  let qs = [];
  if (kind === 'exam') { const ws = shuffle(list); qs = ws.map((x, i) => ({ w: x.w, k: baKindFor(i % 2 ? 'meanwrite' : 'write'), ph: 'first' })); qs = baSpread(qs); }
  else list.forEach(x => kinds.forEach(k => qs.push({ w: x.w, k: baKindFor(k), ph: kind === 'review' ? 'review' : 'first' })));
  if (kind !== 'exam') qs = baSpread(qs);
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind, label, qs, at: Date.now() };
}

/* ---------- option order: reshuffled every time, and never the same slot as last time for that word ---------- */
const BA_LASTPOS = {};
function baOptions(q) {
  const x = BA_W[q.w]; const same = BA_WORDS.filter(o => o.L === x.L && o.w !== x.w); const other = BA_WORDS.filter(o => o.L !== x.L);
  const ds = q.k === 'meaning' ? shuffle(same).slice(0, 3) : shuffle(same).slice(0, 2).concat(shuffle(other).slice(0, 1));
  let opts = shuffle([x.w].concat(ds.map(d => d.w))); const key = q.w + q.k;
  for (let g = 0; g < 6 && opts.indexOf(x.w) === BA_LASTPOS[key]; g++) opts = shuffle(opts);
  BA_LASTPOS[key] = opts.indexOf(x.w); return opts;
}
function baTiles(w) {
  const letters = w.replace(/ /g, '').split('');
  const extra = shuffle('bcdfghklmnprstvwz'.split('').filter(c => !letters.includes(c))).slice(0, letters.length > 6 ? 3 : 2);
  let t = shuffle(letters.concat(extra)); for (let g = 0; g < 6 && t.join('').startsWith(letters.join('')); g++) t = shuffle(t);
  return t.map((c, i) => ({ c, i, used: false }));
}

/* ---------- question views (one attempt each) ---------- */
function BaHear({ text, auto, label = 'Listen' }) {
  const [on, setOn] = useState(false);

  if (!CAN_SPEAK) return null;

}
function BaChoice({ q, onAnswer, locked }) {
  const [opts] = useState(() => baOptions(q)); const [picked, setPicked] = useState(null); const x = BA_W[q.w];

  </div>`;
}
function BaBuild({ q, onAnswer, locked }) {
  const x = BA_W[q.w]; const [tiles, setTiles] = useState(() => baTiles(q.w));
  const n = q.w.replace(/ /g, '').length; const [slots, setSlots] = useState(() => Array(n).fill(null)); const [sent, setSent] = useState(false);
  const put = t => { if (sent || t.used) return; const i = slots.indexOf(null); if (i < 0) return; const s = slots.slice(); s[i] = t.i; setSlots(s); setTiles(tiles.map(o => o.i === t.i ? Object.assign({}, o, { used: true }) : o)); };
  const take = i => { if (sent || slots[i] === null) return; const ti = slots[i]; const s = slots.slice(); s[i] = null; setSlots(s); setTiles(tiles.map(o => o.i === ti ? Object.assign({}, o, { used: false }) : o)); };

    <div className="ba-slots-wrap">${parts}</div>
    <div className="tiles">${tiles.map(t => html`<button key=${t.i} className=${'tile' + (t.used ? ' ghost' : '')} disabled=${t.used || sent || locked} onClick=${() => put(t)}>${t.used ? '' : t.c}</button>`)}</div>

/* ---------- a round: practice (with later retries) · review · exam (no feedback until the end) ---------- */
function BaRound({ round, pid, onEnd, onQuit }) {
  const [qs, setQs] = useState(round.qs); const [i, setI] = useState(0); const [fb, setFb] = useState(null);
  const [res, setRes] = useState([]); const [quit, setQuit] = useState(false); const [saveOK, setSaveOK] = useState(true);
  const exam = round.kind === 'exam'; const q = qs[i];
  const answer = (a, ok) => {
    const P = baLoad(pid); baRecord(P, round, q, a, ok); setSaveOK(baSave(pid, P));
    const r = res.concat([{ w: q.w, k: q.k, ph: q.ph, a, ok }]); setRes(r);
    if (exam) { try { window.speechSynthesis.cancel(); } catch (e) { } if (i + 1 >= qs.length) onEnd(r); else setI(i + 1); return; }
    let retry = false;
    if (!ok && !exam && q.ph === 'first' && qs.length - (i + 1) >= 2) { retry = true; const n = qs.slice(); n.splice(Math.min(i + 3, n.length), 0, { w: q.w, k: q.k, ph: 'retry' }); setQs(n); }
    setFb({ ok, retry, written: !!BA_WRITTEN[q.k] });
  };
  const next = () => { try { window.speechSynthesis.cancel(); } catch (e) { } setFb(null); if (i + 1 >= qs.length) { onEnd(res); return; } setI(i + 1); };
  const firstCount = qs.filter(x => x.ph !== 'retry').length; const firstDone = res.filter(x => x.ph !== 'retry').length; const posNow = qs.slice(0, i + 1).filter(x => x.ph !== 'retry').length;
  const View = q.k === 'build' ? BaBuild : BA_WRITTEN[q.k] ? BaWrite : BaChoice;
  let msg = null;
  if (fb) msg = exam ? { c: 'bt-info', t: 'Answer saved.', p: i + 1 < qs.length ? 'One more word!' : 'That was the last word!' }
    : fb.ok ? { c: 'right', t: fb.written ? 'Great! You got it on your own!' : 'You remembered it!', p: q.ph === 'retry' ? 'You came back and got it.' : '' }
    : { c: 'try', t: 'Not quite!', p: fb.retry ? "Let's practice this one again in a little while." : "Let's practice this one again in the review." };
  return html`<div className="screen play ba-play" style=${{ '--wc': '#8f6bff' }}>

    ${quit ? html`<${ConfirmDialog} title="¿Salir de esta ronda?" text=${saveOK ? 'Las respuestas que ya diste están guardadas.' : 'Este navegador no está guardando.'} cancelLabel="Seguir jugando" okLabel="Salir" onCancel=${() => setQuit(false)} onOk=${onQuit}/>` : null}
    <div className="panel qcard">
      <${View} key=${i + q.w + q.k} q=${q} onAnswer=${answer} locked=${!!fb} exam=${exam}/>
      ${msg ? html`<div className=${'feedback ' + msg.c} role="status"><div className="fb-msg"><span className="ba-fb-art"><${Tuga} size=${64}/></span><div><strong>${msg.t}</strong>${msg.p ? html`<p>${msg.p}</p>` : null}</div></div>
        <div className="fb-btns"><button className="btn go" autoFocus onClick=${next}>${i + 1 >= qs.length ? (exam ? 'See my results' : 'Finish') : 'Next word'}</button></div></div>` : null}

/* ---------- review stage: corrective feedback, separate from the evaluation ---------- */

  const missed = []; res.forEach(r => { if (!r.ok && !missed.includes(r.w)) missed.push(r.w); });
  const fixedLater = res.filter(r => r.ph === 'retry' && r.ok).length;

/* ---------- what each word needs (kids' view): replaces the colored dots ----------

   grow = right so far, still collecting its 3 rounds (and the written one)
   new / done */
const BA_SKILL_EN = { listen: 'hearing it', meaning: 'its meaning', build: 'building it', write: 'spelling it', meanwrite: 'spelling it' };

  if (s.mastered) return { k: 'done' };
  if (s.lastFirst === false) return { k: 'fix', skill: s.lastFail };
  return { k: 'grow', rounds: Math.min(s.ev.length, 3), written: s.ev.some(e => e.wr) };
}
function baNeedText(n) {

  if (n.k === 'fix') return `Missed last time: ${BA_SKILL_EN[n.skill] || 'this word'}.`;
  const left = 3 - n.rounds; const bits = [];
  if (left > 0) bits.push(`${left} more ${left === 1 ? 'round' : 'rounds'}`);
  if (!n.written) bits.push('write it by yourself once');
  return bits.length ? 'Keep going: ' + bits.join(' + ') + '.' : 'Almost there!';
}
// Practice round aimed at what failed: the skill he missed + one written check.
function baTrickyRound(words, P, label) {
  const qs = []; words.forEach(x => { const s = P.words[x.w] || {}; const k = baKindFor(s.lastFail || 'meaning'); qs.push({ w: x.w, k, ph: 'first' }); if (!BA_WRITTEN[k]) qs.push({ w: x.w, k: baKindFor('write'), ph: 'first' }); });
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind: 'practice', label, qs: baSpread(qs), at: Date.now() };
}
const baToFix = (P, list) => list.filter(x => baNeed(P.words[x.w]).k === 'fix');
function BaWordList({ P, list }) {
  return html`<ul className="ba-wl">${list.map(x => { const n = baNeed(P.words[x.w]);
    return html`<li key=${x.w} className=${'ba-wr ' + n.k}>
      <span className="ba-wr-ic" aria-hidden="true">${n.k === 'done' ? '★' : n.k === 'fix' ? '!' : n.k === 'new' ? '+' : ''}</span>
      <div className="ba-wr-txt"><b>${x.w}</b><span>${baNeedText(n)}</span></div>
      ${n.k === 'grow' || n.k === 'done' ? html`<span className="ba-steps" role="img" aria-label=${`${n.k === 'done' ? 3 : n.rounds} of 3 rounds${n.k === 'done' || n.written ? ', written' : ''}`}>
        ${[0, 1, 2].map(k => html`<i key=${k} className=${(n.k === 'done' || k < n.rounds) ? 'on' : ''}></i>`)}<em className=${n.k === 'done' || n.written ? 'on' : ''}>✎</em></span>` : null}
    </li>`; })}</ul>`;
}
function baLessonLine(P, l) {
  const c = { done: 0, fix: 0, grow: 0, new: 0 }; l.words.forEach(x => c[baNeed(P.words[x.w]).k]++);
  const out = [`${c.done} of 5 mastered`]; if (c.fix) out.push(`${c.fix} to fix`); if (c.new) out.push(`${c.new} new`);
  return { c, text: out.join(' · ') };
}

/* ---------- parents' panel (behind the shared gate) ---------- */
function BaParent({ pid, ix, setIx, onBack, startRound }) {
  const [P, setP] = useState(() => baLoad(pid)); const [newName, setNewName] = useState(''); const [confirm, setConfirm] = useState(false);
  const rows = BA_WORDS.map(x => ({ x, s: P.words[x.w] || null, st: baStatus(P.words[x.w]) }));
  const cnt = k => rows.filter(r => r.st === k).length;
  const tot = rows.reduce((a, r) => { const s = r.s; if (s) { a.first += s.first; a.firstOK += s.firstOK; a.after += s.after; a.afterOK += s.afterOK; a.att += s.att; } return a; }, { first: 0, firstOK: 0, after: 0, afterOK: 0, att: 0 });
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const prio = rows.filter(r => r.s && r.st !== 'mastered').sort((a, b) => (b.s.err - b.s.firstOK * 0.5) - (a.s.err - a.s.firstOK * 0.5)).slice(0, 6)
    .concat(rows.filter(r => !r.s)).slice(0, 6);
  const fmt = t => t ? new Date(t).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : '—';
  const addPlayer = () => { const name = newName.trim(); if (!name) return; let id = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'nino'; while (ix.players.some(p => p.id === id)) id += '-2'; const n = { current: id, players: ix.players.concat([{ id, name }]) }; baSaveIndex(n); setIx(n); setNewName(''); };
  const switchTo = id => { const n = Object.assign({}, ix, { current: id }); baSaveIndex(n); setIx(n); };
  const reset = () => { baSave(pid, baFresh()); setP(baFresh()); setConfirm(false); };
  const name = (ix.players.find(p => p.id === pid) || {}).name || pid;
  return html`<div className="screen parent ba-parent">
    <div className="topbar"><${NavBtn} icon="back" label="Brain Academy" onClick=${onBack}/><h2>Brain Academy · Panel de mamá y papá</h2></div>
    <section className="panel"><h3>Jugador</h3>
      <div className="seg">${ix.players.map(p => html`<button key=${p.id} className=${p.id === pid ? 'on' : ''} onClick=${() => switchTo(p.id)}>${p.name}</button>`)}</div>
      <p className="muted">Cada niño guarda su progreso por separado en este dispositivo. Este progreso es independiente de la aventura de Cozumel.</p>
      <div className="ba-add"><label className="ba-sr" htmlFor="ba-new">Nombre</label><input id="ba-new" type="text" value=${newName} onInput=${e => setNewName(e.target.value)} placeholder="Agregar otro niño" autoComplete="off" maxLength="20"/><button className="btn ghost" onClick=${addPlayer} disabled=${!newName.trim()}>Agregar</button></div>
    </section>
    <section className="panel"><h3>Resumen de ${name}</h3>
      <div className="kpis"><div><b>${cnt('mastered')}/20</b><span>dominadas</span></div><div><b>${cnt('practice')}</b><span>en práctica</span></div><div><b>${cnt('new')}</b><span>sin evaluar</span></div>
        <div><b>${pct(tot.firstOK, tot.first)}</b><span>exactitud del primer intento (${tot.firstOK}/${tot.first})</span></div>
        <div><b>${tot.afterOK}/${tot.after}</b><span>aciertos después de repaso</span></div><div><b>${tot.att}</b><span>intentos en total</span></div></div>
      <p className="muted">Dominada = 3 rondas distintas con la palabra correcta al primer intento, incluyendo al menos una escrita sin pistas (dictado o examen). Reconocer la palabra entre opciones no sustituye escribirla. Los aciertos después de un error o en el repaso se cuentan aparte y no suman al dominio. Si una palabra dominada se falla después, vuelve a «En práctica» y necesita sus 3 rondas otra vez.</p>
    </section>
    <section className="panel"><h3>Palabras prioritarias</h3>
      ${prio.length ? html`<p className="ba-prio">${prio.map(r => r.x.w + (r.s && r.s.lastFail && r.s.lastFirst === false ? ` (${BA_SKILL_ES[r.s.lastFail]})` : '')).join(' · ')}</p><button className="btn go" onClick=${() => startRound(baMakeRound('practice', prio.map(r => r.x), ['meaning', 'build', 'write'], 'Priority words'))}>Practicar estas palabras</button>` : html`<p>¡Las 20 palabras están dominadas!</p>`}
    </section>
    <section className="panel"><h3>Rendimiento por lección</h3>
      <div className="tbl-wrap" tabIndex="0" role="region" aria-label="Lecciones"><table className="tbl"><thead><tr><th>Lección</th><th>Dominadas</th><th>1er intento</th><th>Errores</th><th>Tras repaso</th></tr></thead><tbody>
      ${BA_LESSONS.map(l => { const rs = rows.filter(r => r.x.L === l.n); const f = rs.reduce((a, r) => a + (r.s ? r.s.first : 0), 0), fo = rs.reduce((a, r) => a + (r.s ? r.s.firstOK : 0), 0), er = rs.reduce((a, r) => a + (r.s ? r.s.err : 0), 0), af = rs.reduce((a, r) => a + (r.s ? r.s.after : 0), 0), afo = rs.reduce((a, r) => a + (r.s ? r.s.afterOK : 0), 0);
        return html`<tr key=${l.n}><td>${l.n} · ${l.t}</td><td>${rs.filter(r => r.st === 'mastered').length}/5</td><td>${pct(fo, f)} <small className="muted">(${fo}/${f})</small></td><td>${er}</td><td>${afo}/${af}</td></tr>`; })}
      </tbody></table></div></section>
    <section className="panel"><h3>Palabra por palabra</h3>
      <div className="tbl-wrap" tabIndex="0" role="region" aria-label="Palabras"><table className="tbl"><thead><tr><th>Palabra</th><th>Lección</th><th>Estado</th><th>Intentos</th><th>1er intento ✓</th><th>Errores</th><th>Tras repaso ✓</th><th>Evidencia</th><th>Falla en</th><th>Última vez</th></tr></thead><tbody>
      ${rows.map(r => { const s = r.s; return html`<tr key=${r.x.w}><td><b>${r.x.w}</b></td><td>${r.x.L}</td><td><span className=${'pill ' + BA_ST_PILL[r.st]}>${BA_ST_ES[r.st]}</span></td>
        <td>${s ? s.att : 0}</td><td>${s ? `${s.firstOK}/${s.first}` : '0/0'}</td><td>${s ? s.err : 0}</td><td>${s ? `${s.afterOK}/${s.after}` : '0/0'}</td>
        <td>${s ? `${Math.min(s.ev.length, 3)}/3 rondas · ${s.ev.some(e => e.wr) ? 'escrita ✓' : 'falta escrita'}` : '—'}${s && s.lapses ? html` <small className="muted">(se olvidó ${s.lapses}×)</small>` : null}</td><td style=${{ whiteSpace: 'normal' }}>${s && s.ek ? Object.entries(s.ek).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${BA_SKILL_ES[k]} (${v})`).join(', ') : '—'}</td><td>${fmt(s && s.last)}</td></tr>`; })}
      </tbody></table></div></section>
    <section className="panel"><h3>Exámenes finales</h3>
      ${P.exams.length ? html`<div className="tbl-wrap" tabIndex="0" role="region" aria-label="Exámenes"><table className="tbl"><thead><tr><th>Fecha</th><th>Resultado</th><th>Palabras falladas</th></tr></thead><tbody>
        ${P.exams.slice().reverse().map((e, k) => html`<tr key=${k}><td>${fmt(e.at)}</td><td><b>${e.score}/${e.total}</b></td><td style=${{ whiteSpace: 'normal' }}>${e.missed.length ? e.missed.map(m => `${m.w} («${m.a}»)`).join(', ') : '—'}</td></tr>`)}
      </tbody></table></div>` : html`<p className="muted">Todavía no hay exámenes.</p>`}
    </section>
    <section className="panel"><h3>Borrar progreso de ${name}</h3>
      ${confirm ? html`<p><b>Se borrarán todos los intentos, el dominio y los exámenes de Brain Academy de ${name}.</b> La aventura de Cozumel no se toca.</p><div className="row-btns"><button className="btn ghost" onClick=${() => setConfirm(false)}>Cancelar</button><button className="btn coral" onClick=${reset}>Sí, borrar</button></div>`
        : html`<button className="btn ghost danger" onClick=${() => setConfirm(true)}>Borrar progreso de Brain Academy</button>`}
    </section>
  </div>`;
}

/* ---------- section shell ---------- */
function BrainAcademy({ view: initView, go }) {
  const [ix, setIx] = useState(baIndex); const pid = ix.current;
  const [view, setView] = useState(initView || 'hub'); const [L, setL] = useState(1);
  const [round, setRound] = useState(null); const [res, setRes] = useState(null); const [, bump] = useState(0);
  const P = baLoad(pid);
  const start = r => { setRound(r); setRes(null); setView('round'); };
  const endRound = r => {
    const D = baLoad(pid);
    D.rounds.push({ id: round.id, kind: round.kind, label: round.label, at: Date.now(), n: r.filter(x => x.ph !== 'retry').length, ok: r.filter(x => x.ph !== 'retry' && x.ok).length });
    if (round.kind === 'exam') D.exams.push({ at: Date.now(), score: r.filter(x => x.ok).length, total: r.length, missed: r.filter(x => !x.ok).map(x => ({ w: x.w, a: x.a })) });
    if (D.rounds.length > 400) D.rounds = D.rounds.slice(-400);
    baSave(pid, D); setRes(r); setView('review');
  };
  const back = () => { setRound(null); setView(round && round.L ? 'lesson' : 'hub'); bump(x => x + 1); };
  if (view === 'parent') return html`<${BaParent} key=${pid} pid=${pid} ix=${ix} setIx=${setIx} onBack=${() => setView('hub')} startRound=${r => start(r)}/>`;
  if (view === 'round' && round) return html`<${BaRound} key=${round.id} round=${round} pid=${pid} onEnd=${endRound} onQuit=${back}/>`;
  if (view === 'review' && round && res) return html`<${BaReview} round=${round} res=${res} onBack=${back}
    onPractice=${ws => start(Object.assign(baMakeRound('review', ws.map(w => BA_W[w]), round.kind === 'exam' ? ['write'] : Array.from(new Set(res.filter(x => !x.ok).map(x => x.k))).slice(0, 2), 'Review practice'), { L: round.L }))}
    onAgain=${round.kind === 'review' ? null : () => start(Object.assign(baMakeRound(round.kind, round.kind === 'exam' ? BA_WORDS : BA_LESSONS[round.L - 1].words, round.kinds, round.label), { L: round.L, kinds: round.kinds }))}/>`;
  if (view === 'study') return html`<${BaStudy} lesson=${BA_LESSONS[L - 1]} onDone=${() => setView('lesson')}/>`;
  const name = (ix.players.find(p => p.id === pid) || {}).name || 'Diego';
  if (view === 'lesson') {
    const les = BA_LESSONS[L - 1];
    return html`<div className="screen ba">
      <div className="topbar"><${NavBtn} icon="back" label="Brain Academy" onClick=${() => setView('hub')}/><h2>Lesson ${les.n} · ${les.t}</h2></div>
      <div className="panel ba-head"><${Tuga} size=${96}/><div><p className="m-bubble">${baToFix(P, les.words).length ? 'Some words need a little more practice. Let\'s fix them!' : 'Learn the words first. Then show me what you remember!'}</p></div></div>
      <div className="panel"><h3 className="ba-sub">My words</h3><${BaWordList} P=${P} list=${les.words}/>
        ${baToFix(P, les.words).length ? html`<button className="btn coral big ba-fix" onClick=${() => start(Object.assign(baTrickyRound(baToFix(P, les.words), P, 'Fix my words'), { L: les.n }))}>Practice the words I missed</button>` : null}</div>
      <div className="ba-acts">
        <button className="studio-entry panel ba-act" onClick=${() => setView('study')}><span className="ba-act-n">1</span><div><span className="eyebrow">No score</span><strong>Study the words</strong><span>Hear each word and its meaning.</span></div><span className="arrow">›</span></button>
        ${['listen', 'build', 'write'].map((a, k) => html`<button key=${a} className="studio-entry panel ba-act" onClick=${() => start(Object.assign(baMakeRound('practice', les.words, BA_ACT[a].kinds, BA_ACT[a].t), { L: les.n, kinds: BA_ACT[a].kinds }))}>
          <span className="ba-act-n">${k + 2}</span><div><span className="eyebrow">${a === 'write' ? 'Counts as written' : 'Practice'}</span><strong>${BA_ACT[a].t}</strong><span>${BA_ACT[a].s}</span></div><span className="arrow">›</span></button>`)}
      </div></div>`;
  }
  const mastered = BA_WORDS.filter(x => baStatus(P.words[x.w]) === 'mastered').length;
  return html`<div className="screen ba">
    <div className="topbar"><${NavBtn} icon="back" label="Mapa" onClick=${() => go('map')}/><h2>Brain Academy</h2><span className="chip-w">Player: ${name}</span></div>
    <div className="panel ba-head"><${Tuga} size=${110}/><div><span className="eyebrow">Vocabulary Challenge</span><h2 className="ba-h">${mastered === 20 ? 'You mastered all 20 words!' : `${mastered} of 20 words mastered`}</h2>
      <p className="m-bubble">A word is mastered when you get it right in 3 different rounds, and you write it by yourself at least once.</p></div></div>
    ${baToFix(P, BA_WORDS).length ? html`<div className="panel ba-fixbox"><h3 className="ba-sub">Words to fix</h3><${BaWordList} P=${P} list=${baToFix(P, BA_WORDS).slice(0, 6)}/>
      <button className="btn coral big ba-fix" onClick=${() => start(Object.assign(baTrickyRound(baToFix(P, BA_WORDS).slice(0, 6), P, 'Fix my words'), { L: 0 }))}>Practice the words I missed</button></div>` : null}
    <div className="ba-lessons">${BA_LESSONS.map(l => { const m = l.words.filter(x => baStatus(P.words[x.w]) === 'mastered').length; return html`<button key=${l.n} className="panel ba-lesson" onClick=${() => { setL(l.n); setView('lesson'); }}>
      <span className="eyebrow">Lesson ${l.n}</span><strong>${l.t}</strong><span className=${'ba-lline' + (baLessonLine(P, l).c.fix ? ' fix' : '')}>${baLessonLine(P, l).text}</span></button>`; })}</div>
    <button className="studio-entry panel ba-exam" onClick=${() => start(Object.assign(baMakeRound('exam', BA_WORDS, null, 'Final Exam'), { L: 0 }))}>
      <span className="ba-act-n">★</span><div><span className="eyebrow">All 4 lessons · no hints</span><strong>Final Exam · 20 words</strong><span>Write every word. You see your results at the end.</span></div><span className="arrow">›</span></button>
    <button className="parent-link ba-plink" onClick=${() => go('braingate')}>Panel de mamá y papá · Brain Academy</button>
  </div>`;
}

</script>
</body>
