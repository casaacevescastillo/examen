<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" sizes="180x180"
      href="./apple-touch-icon.png">

<link rel="icon" type="image/png"
      href="./favicon.png">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-title"
      content="Diego Cozumel">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta property="og:title"
      content="Las 5 Perlas de Cozumel">

<meta property="og:description"
      content="La aventura educativa de Diego">

<meta property="og:image"
      content="https://casaacevescastillo.github.io/diego-cozumel/thumbnail.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Diego y la aventura de las 5 perlas de Cozumel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: one-column game stage over a living Caribbean gradient; panels are "pearl" cards floating in the sea. Single committed tropical look. */
:root{
  --abyss:#06324a; --sea:#0b7aa0; --lagoon:#1cc6c4; --foam:#e6fbf8; --sand:#ffe3a3;
  --coral:#ff7058; --sun:#ffc531; --kelp:#1fa874; --ink:#0d2b3e; --pearl:#fffaf1; --muted:#4f6b7a; --line:#cfe8ee;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --radius-card:22px; --radius-tile:16px; --radius-pill:999px;
  --radius-hero:32px; --cream-hero:#fff9f0; --ink-hero:#102f43; --muted-hero:#527082; --tint-hero:#e3f7fa;
  --shadow-hero:0 10px 0 rgba(7,61,82,.24),0 20px 36px rgba(5,51,76,.15);
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#root{min-height:100%}
.app{position:relative;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#22b3cf 0%,#0d86ab 30%,#0a5f86 70%,#06324a 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--space-3) 40px}
.app::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:
  radial-gradient(60% 40% at 20% 0%,rgba(255,255,255,.25),transparent 70%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 18px,transparent 18px 60px);filter:saturate(var(--sat,1))}
.screen{position:relative;z-index:1;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-4)}
/* Section stack: groups inside a page are separated by --space-6; items inside a group use the group's own gap */
.stack,.studio-hub,.m-hub,.gallery{display:flex;flex-direction:column;gap:var(--space-6)}
.studio-hub > .btn,.m-hub > .btn,.gallery > .btn{align-self:stretch}
.screen.center{min-height:calc(100vh - 60px);justify-content:center}
.panel{background:var(--pearl);border-radius:26px;padding:var(--space-5);box-shadow:0 8px 0 rgba(3,30,46,.28)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;color:var(--ink)}
h2{font-size:clamp(24px,4.6vw,32px)}
h3{font-size:24px}
p{margin:0}
.eyebrow{font-family:var(--display);color:var(--sea);letter-spacing:1px;text-transform:uppercase;font-size:14px}
.muted{color:var(--muted);font-size:15px}
.muted.light{color:#d8f4f7}
.warn{background:#fff1d6;border-radius:12px;padding:var(--space-3);font-size:15px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font-family:var(--display);font-size:20px;border:0;border-radius:18px;padding:var(--space-3) var(--space-6);min-height:56px;cursor:pointer;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c58b00;transition:transform .08s,box-shadow .08s;letter-spacing:.3px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #c58b00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:24px;min-height:64px;padding:var(--space-4) var(--space-8)}
.btn.lagoon{background:var(--lagoon);box-shadow:0 5px 0 #0c8b8a;color:#05313d}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 #c9452f}
.btn.ghost{background:#e8f6f8;box-shadow:0 4px 0 #b8dbe2;color:var(--ink)}
button{font-family:inherit}
:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--ink)}
.row-btns{display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap}
.icon-btn{width:52px;height:52px;border-radius:16px;border:0;background:var(--pearl);color:var(--sea);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(3,30,46,.3);flex:none}
.speak{display:inline-flex;align-items:center;gap:var(--space-2);border:0;background:#e3f7fb;color:var(--sea);border-radius:999px;padding:var(--space-2) var(--space-4);font-weight:700;font-size:15px;cursor:pointer;margin-top:var(--space-2)}

/* home */
.hero{width:100%;height:clamp(180px,38vh,320px);border-radius:28px;display:block;box-shadow:0 8px 0 rgba(3,30,46,.28);transition:filter .6s}
.home-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-4);position:relative}
.home-btns{display:flex;flex-direction:column;gap:var(--space-3);width:min(100%,360px)}
.parent-link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;cursor:pointer;padding:var(--space-2)}
.pearl-row{display:flex;gap:var(--space-2);justify-content:center;align-items:center;flex-wrap:wrap}
.aquarium{position:relative;width:100%;height:150px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#c6f3f6,#5ccbe0 70%,#f5dfa6 70%,#f2d48e)}
.aq-swim{position:absolute;left:-90px;animation:swim linear infinite}
.aq-empty{color:var(--muted);font-size:15px}
.wave{animation:wave 5s linear infinite}
.tuga-peek{animation:peek 4s ease-in-out infinite}

.float{animation:bob 3.2s ease-in-out infinite}
.bubbles span{position:fixed;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);animation:rise 12s linear infinite;z-index:0;pointer-events:none}

/* story & checkin */
.story-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-4)}
.speech{background:#e6f8fb;border-radius:20px;padding:var(--space-4) var(--space-5);font-size:20px;max-width:58ch;position:relative}
.duo{display:flex;align-items:flex-end;gap:var(--space-3)}
.row-head{display:flex;align-items:center;gap:var(--space-3)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);margin:var(--space-4) 0}
.theme-btn{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-4) var(--space-3);border-radius:20px;border:3px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;min-height:110px}
.theme-btn .emo{font-size:40px}
.theme-btn:hover{border-color:var(--lagoon)}

/* map */
.topbar{display:flex;align-items:center;gap:var(--space-3);color:#fff;flex-wrap:wrap;margin-bottom:var(--space-2)}
.topbar h2{flex:1;min-width:0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.daily{display:flex;align-items:center;gap:var(--space-4);border:0;cursor:pointer;text-align:left;color:var(--ink);font-size:16px}
.daily strong{font-family:var(--display);font-size:24px;display:block;font-weight:400}
.daily .arrow{margin-left:auto;font-size:40px;color:var(--sea)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--space-4)}
.world{--wc:#2f8cff;display:flex;flex-direction:column;gap:var(--space-2);text-align:left;border:0;cursor:pointer;border-radius:24px;padding:var(--space-4);background:var(--pearl);color:var(--ink);box-shadow:0 6px 0 rgba(3,30,46,.28);border-top:10px solid var(--wc)}
.world strong{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.world .subj{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.w-top{display:flex;justify-content:space-between;align-items:center}
.w-meta{font-size:14px;color:var(--muted)}
.secret{align-self:flex-start;font-family:var(--display);font-size:13px;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:var(--sun);border-radius:999px;padding:3px var(--space-3)}
.bar{height:12px;border-radius:999px;background:#e2eff2;overflow:hidden}
.bar i{display:block;height:100%;background:var(--wc,var(--lagoon));border-radius:999px;transition:width .6s}
.guardian{display:flex;align-items:center;gap:var(--space-4);border:0;text-align:left;cursor:pointer;color:var(--ink);background:linear-gradient(120deg,#fff6d8,#ffe2f0)}
.guardian strong{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.guardian.locked{opacity:.75;cursor:not-allowed}
.g-pearls{display:flex;gap:var(--space-1);flex-wrap:wrap;justify-content:center;align-items:center}

/* play */
.play .topbar{gap:var(--space-3)}
.chip-w{font-family:var(--display);background:rgba(255,255,255,.18);padding:var(--space-2) var(--space-3);border-radius:999px;font-size:16px}
.dots{display:flex;gap:var(--space-2);margin-left:auto;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.ok{background:var(--sun)}.dots i.tried{background:#9fe3f0}.dots i.now{background:#fff;box-shadow:0 0 0 3px var(--sun)}
.qcard{border-top:10px solid var(--wc,var(--lagoon))}
.qwrap{display:flex;flex-direction:column;gap:var(--space-4)}
.final-banner{align-self:center;font-family:var(--display);background:var(--ink);color:var(--sun);padding:var(--space-2) var(--space-4);border-radius:999px;display:flex;align-items:center;gap:var(--space-2)}
.qhead{display:flex;gap:var(--space-3);align-items:flex-start}
.qguide{flex:none}
.bubble{background:#e6f8fb;border-radius:20px;padding:var(--space-3) var(--space-4);font-size:22px;font-weight:700;flex:1;min-width:0;position:relative}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:#e6f8fb;border-left:0}
.quit{text-align:center;display:flex;flex-direction:column;gap:var(--space-3)}

/* visuals */
.v-big{font-family:var(--body);font-weight:700;font-size:96px;line-height:1;text-align:center;color:var(--sea)}
.v-quote{font-size:26px;font-weight:700;text-align:center;background:#fff;border:3px dashed var(--line);border-radius:18px;padding:var(--space-4);display:flex;align-items:center;justify-content:center;gap:var(--space-3);flex-wrap:wrap}
.v-quote .emo{font-size:44px}
.blank{display:inline-block;min-width:2.4em;border-bottom:4px solid var(--coral);color:var(--coral);text-align:center;margin:0 var(--space-1)}
.v-pic{font-size:84px;text-align:center;line-height:1.1}
.v-abc{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-1);font-size:18px;font-weight:700;color:var(--sea)}
.v-abc span{background:#e3f7fb;border-radius:8px;padding:2px 7px}
.v-frames{display:flex;gap:var(--space-4);justify-content:center;flex-wrap:wrap}
.tenframe{display:grid;grid-template-columns:repeat(5,34px);grid-auto-rows:34px;gap:3px;background:#0a6f8f;padding:var(--space-1);border-radius:10px}
.tenframe .cell{background:#e6fbf8;border-radius:6px;display:grid;place-items:center}
.v-rods{display:flex;gap:var(--space-2);justify-content:center;align-items:flex-end;flex-wrap:wrap}
.rod-wrap{display:flex;flex-direction:column;align-items:center;gap:var(--space-1)}
.rod{display:grid;grid-template-rows:repeat(10,13px);width:18px;gap:1px;background:#0b5d86;padding:1px;border-radius:4px}
.rod i,.ones i{display:block;background:#4fc3f7;border-radius:2px}
.ones{display:flex;flex-wrap:wrap;width:60px;gap:3px;align-content:flex-end}
.ones i{width:16px;height:16px;background:#ffb627;box-shadow:inset 0 0 0 2px #d48a00}
.v-rods.sm .rod{grid-template-rows:repeat(10,9px);width:13px}
.ones.grid{width:56px;margin:auto}
.v-pv{margin:0 auto;border-collapse:separate;border-spacing:0;border:3px solid var(--sea);border-radius:16px;overflow:hidden;background:#fff}
.v-pv th{background:var(--sea);color:#fff;font-family:var(--display);font-weight:400;font-size:20px;padding:var(--space-2) var(--space-6)}
.v-pv td{padding:var(--space-3);min-width:110px;min-height:80px;text-align:center;vertical-align:bottom;border-right:3px solid var(--line)}
.v-pv td:last-child{border-right:0}
.pv-empty{font-size:40px;color:var(--line);font-weight:700}
.v-nl{position:relative;display:flex;justify-content:space-between;padding:var(--space-3) var(--space-2) 0;max-width:520px;margin:0 auto;width:100%}
.nl-track{position:absolute;left:0;right:0;top:20px;height:5px;background:var(--sea);border-radius:5px}
.nl-pt{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);position:relative}
.nl-pt .dot{width:4px;height:24px;background:var(--sea)}
.nl-pt b{font-size:22px}
.nl-pt.gap b{background:var(--coral);color:#fff;border-radius:10px;padding:0 var(--space-3)}
.v-shape{display:flex;justify-content:center}
.v-pattern{display:flex;flex-wrap:wrap;gap:var(--space-2);justify-content:center;align-items:center;background:#fff;border-radius:18px;padding:var(--space-3)}
.pat-q{width:44px;height:44px;border:3px dashed var(--coral);border-radius:10px;display:grid;place-items:center;font-weight:700;color:var(--coral);font-size:24px}
.v-story{background:#fffdf6;border:3px solid #f1e3bf;border-radius:18px;padding:var(--space-4) var(--space-4);font-size:21px;max-width:62ch;margin:0 auto}
.v-story.info{border-color:#bfe3f1}
.v-story h4{font-size:20px;color:var(--sea);margin-bottom:var(--space-2)}
.dotnum{color:var(--coral);font-size:28px}.dotnum sup{font-size:14px;background:var(--coral);color:#fff;border-radius:999px;padding:0 5px;margin-left:1px}
.v-cartel{margin:0 auto;max-width:360px;background:#fff59e;border:6px solid #ff9a3c;border-radius:12px;padding:var(--space-4);text-align:center;display:flex;flex-direction:column;gap:var(--space-1);transform:rotate(-1.5deg);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.v-cartel strong{font-family:var(--display);font-weight:400;font-size:28px;color:#d6402a;line-height:1.1}
.v-cartel .c-art{display:flex;justify-content:center}
.v-missing{display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.emo.big{font-size:70px;line-height:1}
.v-missing .word{font-size:52px;font-weight:700;letter-spacing:4px}
.gapbox{display:inline-block;border:4px dashed var(--coral);border-radius:12px;color:var(--coral);text-align:center;margin:0 var(--space-1);line-height:1.1}
.clue{font-size:21px;text-align:center}

/* options */
.opts{display:grid;gap:var(--space-3)}
.opts.grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opts.list{grid-template-columns:1fr}
.opts.visual{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opts.chips{display:flex;flex-wrap:wrap;justify-content:center}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;font-size:22px;font-weight:700;min-height:64px;padding:var(--space-3) var(--space-4);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);transition:transform .1s;box-shadow:0 4px 0 var(--line)}
.opts.big .opt{font-size:34px}
.opts.list .opt{text-align:left;align-items:flex-start;font-size:20px}
.opt:hover:not(:disabled){border-color:var(--lagoon)}
.opt.wrong{border-color:#ffb3a6;background:#fff1ee;animation:shake .4s;opacity:.65}
.opt.right{border-color:var(--kelp);background:#e2f8ec;box-shadow:0 4px 0 var(--kelp)}
.tip{font-size:16px;color:var(--muted);text-align:center}
.ask{font-family:var(--display);font-size:24px;text-align:center;margin-bottom:var(--space-3)}

/* order / sort / build / match */
.order,.sort,.build,.match,.group,.draw{display:flex;flex-direction:column;gap:var(--space-4);align-items:stretch}
.slots{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center}
.order.list .slots{flex-direction:column}
.slot{min-height:58px;min-width:110px;border:3px dashed #9fd3df;border-radius:16px;background:#f1fbfc;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.slot .num{font-family:var(--display);background:var(--sea);color:#fff;border-radius:10px;min-width:32px;height:32px;display:grid;place-items:center;font-size:16px;padding:0 var(--space-2);flex:none}
.slot.filled{border-style:solid;border-color:var(--lagoon);background:#fff}
.slot.bad,.chip.bad,.bslot.bad,.mcard.bad{border-color:var(--coral)!important;background:#fff1ee!important;animation:shake .4s}
.slot.good,.chip.good,.bslot.good{border-color:var(--kelp)!important;background:#e2f8ec!important}
.pool{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:center;min-height:10px}
.chip{border:3px solid var(--line);background:#fff;border-radius:16px;padding:var(--space-3) var(--space-4);font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;min-height:54px;display:inline-flex;align-items:center;gap:var(--space-2);box-shadow:0 4px 0 var(--line);text-align:left}
.order.list .chip{width:100%}
.chip .emo{font-size:26px}
.chip.shell,.slot.shell{border-radius:28px 28px 16px 16px}
.chip.sel{border-color:var(--sun);background:#fff6d6;transform:translateY(-3px);box-shadow:0 7px 0 #e8b400}
.bins{display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bin{border:3px dashed #9fd3df;border-radius:20px;padding:var(--space-3);min-height:120px;background:#f1fbfc;cursor:pointer}
.bin.ready{border-color:var(--sun);background:#fffbe8}
.bin h5{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 var(--space-2);text-align:center;color:var(--sea)}
.bin-items{display:flex;flex-wrap:wrap;gap:var(--space-2);justify-content:center}
.bin-items .chip{font-size:17px;min-height:46px;padding:var(--space-2) var(--space-3)}
.bslots{display:flex;gap:var(--space-2);justify-content:center;flex-wrap:wrap}
.bslot{min-width:52px;height:62px;border:0;border-bottom:5px solid var(--sea);background:#f1fbfc;border-radius:12px 12px 4px 4px;font-size:34px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0 var(--space-2)}
.bslot small{font-size:13px;color:var(--muted);font-family:var(--display)}
.tk-digit .bslot{min-width:90px;height:90px}
.tk-word .bslot,.tk-syll .bslot{min-width:80px;font-size:24px}
.bslot.fixed{background:#e2eff2;color:var(--sea)}
.tiles{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center}
.tile{min-width:56px;height:58px;border-radius:14px;border:0;background:var(--sun);box-shadow:0 5px 0 #c58b00;font-size:30px;font-weight:700;color:var(--ink);cursor:pointer;padding:0 var(--space-3);display:grid;place-items:center}
.tk-shape .tile{background:#fff;box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
.tile.ghost{background:transparent;box-shadow:inset 0 0 0 3px rgba(13,43,62,.08);border-radius:14px;min-width:56px;height:58px}
.tk-word .tile,.tk-syll .tile{font-size:24px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.mcol{display:flex;flex-direction:column;gap:var(--space-3)}
.mcard{min-height:62px;border:3px solid var(--line);background:#fff;border-radius:16px;font-size:24px;font-weight:700;color:var(--ink);cursor:pointer;padding:var(--space-2) var(--space-3);display:flex;align-items:center;justify-content:center;gap:var(--space-2);box-shadow:0 4px 0 var(--line)}
.mcard.small{font-size:16px;text-align:left}
.mcard.pic .emo{font-size:36px}
.mcard.sel{border-color:var(--sun);background:#fff6d6}
.mcard.done{border-color:var(--kelp);background:#e2f8ec;opacity:.75}
.bundles{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center}
.bundle{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);animation:pop .35s}
.bundle .tenframe{grid-template-columns:repeat(5,24px);grid-auto-rows:24px}
.loose{display:flex;flex-wrap:wrap;gap:var(--space-1);justify-content:center;max-width:620px;margin:0 auto}
.dotgrid{width:min(100%,300px);margin:0 auto;display:block;background:#fff;border-radius:20px;touch-action:manipulation}
.line-q{padding:var(--space-3) 0 var(--space-5)}
.nl2{position:relative;height:96px;max-width:620px;margin:0 auto}
.nl-bar{position:absolute;left:2%;right:2%;top:40px;height:5px;background:var(--sea);border-radius:5px}
.tick{position:absolute;top:18px;transform:translateX(-50%);width:34px;height:74px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:0;color:var(--ink)}
.tick .mark{width:6px;height:30px;background:var(--sea);border-radius:3px}
.tick b{font-size:16px}
.tick:hover .mark{background:var(--sun)}
.tick.wrong .mark{background:var(--coral)}.tick.right .mark{background:var(--kelp);height:38px;width:10px}.tick.right b{background:var(--kelp);color:#fff;border-radius:8px;padding:0 var(--space-1)}
.tick.start .mark{background:var(--sun)}

/* feedback */
.feedback{display:flex;flex-direction:column;gap:var(--space-3)}
.fb-msg{display:flex;gap:var(--space-3);align-items:center;border-radius:20px;padding:var(--space-3) var(--space-4);animation:pop .3s}
.feedback.right .fb-msg{background:#e2f8ec}.feedback.try .fb-msg{background:#fff4dc}.feedback.reveal .fb-msg{background:#e3f2fb}
.fb-msg strong{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.fb-msg p{font-size:18px}
.fb-btns{display:flex;gap:var(--space-3);justify-content:flex-end;flex-wrap:wrap}
.bounce{animation:bounce .6s}

/* lesson, summary, collection */
.lesson{display:flex;flex-direction:column;gap:var(--space-4);align-items:center;text-align:center;box-shadow:none;padding:var(--space-2)}
.lesson-t{font-size:21px;max-width:58ch}
.lesson-ex{font-size:24px;font-weight:700;background:#fff6d6;border-radius:14px;padding:var(--space-3) var(--space-4);white-space:pre-wrap}
.summary{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);text-align:center}
.discover{background:linear-gradient(160deg,#e3fbff,#fff2fa);border-radius:22px;padding:var(--space-4);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);max-width:440px}
.en{color:var(--muted);font-style:italic}
.stats,.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--space-3);width:100%}
.stats div,.kpis div{background:#eef8fa;border-radius:16px;padding:var(--space-3);display:flex;flex-direction:column;align-items:center;gap:var(--space-1)}
.stats b,.kpis b{font-family:var(--display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums;color:var(--sea)}
.stats span,.kpis span{font-size:14px;color:var(--muted);text-align:center}
.achs{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center}
.ach{background:#fff1e8;border-radius:999px;padding:var(--space-2) var(--space-3);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:var(--space-2)}
.ach.off{background:rgba(255,255,255,.35);color:#e9fbff;filter:grayscale(1)}
.mini-prog{display:flex;flex-direction:column;gap:var(--space-2);width:100%;max-width:440px}
.mp{display:grid;grid-template-columns:32px 1fr 100px;align-items:center;gap:var(--space-2);text-align:left;font-size:15px}
.treasures{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-3);text-align:center}
.treasures > div{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);color:var(--muted)}
.big-n{display:flex;align-items:center;gap:var(--space-2);font-family:var(--display);font-size:32px;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4)}
.ccard{background:var(--pearl);border-radius:22px;padding:var(--space-4);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;box-shadow:0 6px 0 rgba(3,30,46,.28)}
.ccard h4{font-size:21px}
.ccard p{font-size:15px}
.ccard.rare{background:linear-gradient(160deg,#fffaf1,#ffeaf6)}
.ccard.locked{background:#d9eef3}
.status{margin-top:auto;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--sea)}
.gate{display:flex;flex-direction:column;gap:var(--space-4);align-items:center;text-align:center}
.hold{position:relative;overflow:hidden;width:min(100%,320px);height:70px;border-radius:20px;border:3px solid var(--sea);background:#fff;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold .fill{position:absolute;top:0;right:auto;bottom:0;left:0;background:var(--lagoon)}
.hold .lbl{position:relative;font-family:var(--display);font-size:20px}

/* parent */
.parent .panel{display:flex;flex-direction:column;gap:var(--space-3)}
.store{border-radius:14px;padding:var(--space-3) var(--space-4);font-size:15px}
.store.ok{background:#e2f8ec}.store.no{background:#fff1d6}
.recs{margin:0;padding-left:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);font-size:17px}
.subj-d{border:2px solid var(--line);border-radius:16px;padding:var(--space-3) var(--space-3)}
.subj-d summary{display:grid;grid-template-columns:minmax(0,150px) 1fr 50px;gap:var(--space-3);align-items:center;cursor:pointer;font-weight:700;list-style:none}
.subj-d summary::-webkit-details-marker{display:none}
.sd-n{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto;margin-top:var(--space-3)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:460px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;padding:var(--space-2);border-bottom:2px solid var(--line)}
.tbl td{padding:7px var(--space-2);border-bottom:1px solid #e6f1f4;font-variant-numeric:tabular-nums}
.pill{border-radius:999px;padding:2px var(--space-3);font-size:13px;font-weight:700;white-space:nowrap}
.pill.none{background:#edf2f4;color:#6a7f8a}.pill.learning{background:#fff1d6;color:#9a6200}.pill.improving{background:#e3f2fb;color:#0a5f86}.pill.mastered{background:#e2f8ec;color:#137a4e}
.words{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}
.wchip{background:#edf2f4;border-radius:999px;padding:3px var(--space-3);font-size:14px}
.wchip.on{background:#c9f1db;color:#0d5b39;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.seg button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:var(--space-2) var(--space-4);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.topic-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-2)}
.topic-checks label{display:flex;gap:var(--space-2);align-items:center;font-size:16px;padding:var(--space-2);border-radius:10px;background:#f4fafb;cursor:pointer;min-height:44px}
.topic-checks input{width:20px;height:20px}
textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,monospace;font-size:13px;border-radius:12px;border:2px solid var(--line);padding:var(--space-3);color:var(--ink);background:#fff}
.danger{border:3px solid #ffd2c9}

/* certificate */
.cert{display:flex;flex-direction:column;align-items:center;gap:var(--space-4)}
.cert-in{background:#fffaf1;border-radius:28px;padding:var(--space-6);text-align:center;display:flex;flex-direction:column;gap:var(--space-3);align-items:center;border:10px double #e7b84a;max-width:620px;box-shadow:0 10px 0 rgba(3,30,46,.3)}
.cert-in h1{font-size:clamp(34px,7vw,52px);color:var(--sea)}
.cert-in h2{color:var(--coral)}
.cert-chars{display:flex;align-items:flex-end;gap:var(--space-2)}
.cert-in .g-pearls>div{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);width:104px}
.cert-in .g-pearls small{font-size:12px;color:var(--muted)}
.sign{display:flex;justify-content:space-between;width:100%;gap:var(--space-3);border-top:2px solid var(--line);padding-top:var(--space-3);font-family:var(--display);font-size:18px}
.sign small{font-family:var(--body);color:var(--muted);font-size:13px}

/* motion */
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 200px))}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes peek{0%,100%{transform:translateY(6px)}50%{transform:translateY(-4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:1}to{transform:translateY(-110vh);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}
.pop{animation:pop .45s both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bubbles{display:none}}
@media (max-width:520px){
  body{font-size:17px}
  .bubble{font-size:19px}.qguide svg{width:clamp(64px,16vw,96px);height:auto}
  .v-big{font-size:72px}.v-missing .word{font-size:40px}
  .tenframe{grid-template-columns:repeat(5,28px);grid-auto-rows:28px}
  .opts.big .opt{font-size:28px}
  .mcard{font-size:19px}.mcard.small{font-size:14px}
  .subj-d summary{grid-template-columns:minmax(0,1fr) 70px 40px}
  .tick b{font-size:13px}
  .chip-w{display:none}
}

/* ===== Taller del artista ===== */
.studio-entry{display:flex;align-items:center;gap:var(--space-4);border:0;cursor:pointer;text-align:left;color:var(--ink);background:linear-gradient(120deg,#f3e8ff,#fff1e0)}
.studio-entry strong{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.studio-entry .arrow{margin-left:auto;font-size:40px;color:#7b3fb0}
.studio .panel{display:flex;flex-direction:column;gap:var(--space-4)}
.studio-head{flex-direction:row!important;align-items:center;background:linear-gradient(120deg,#fffaf1,#f6ecff)}
.studio-head h2{color:#5b3a9e}
.medals{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--space-3)}
.medal{background:var(--pearl);border-radius:18px;padding:var(--space-3);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;font-weight:700;font-size:14px;box-shadow:0 5px 0 rgba(3,30,46,.25)}
.medal.off{opacity:.7}
.mission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--space-3)}
.mission{border:0;border-radius:22px;background:var(--pearl);padding:var(--space-4);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2);color:var(--ink);box-shadow:0 6px 0 rgba(3,30,46,.28);border-left:10px solid #b58cf0}
.mission.star{border-left-color:#ff4fa3;background:linear-gradient(120deg,#fffaf1,#ffeaf4)}
.m-num{font-family:var(--display);color:#7b3fb0;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.mission strong{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.m-done{color:var(--kelp);font-weight:700;font-size:14px}
.artist-title{display:flex;align-items:center;gap:var(--space-3);background:linear-gradient(120deg,#fff6d6,#ffe2f0);border-radius:22px;padding:var(--space-3) var(--space-4);border:4px double #e7b84a}
.artist-title strong{font-family:var(--display);font-weight:400;font-size:24px;display:block;color:#7b3fb0}
.m-head{display:flex;align-items:center;gap:var(--space-3)}
.m-head h2{font-size:24px}
.badge-win{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);text-align:center}
.badge-win strong{font-family:var(--display);font-weight:400;font-size:26px;display:block}
.note{background:#f4ecff;border-radius:16px;padding:var(--space-3) var(--space-4);font-size:17px}
.soft{color:#9a6200;background:#fff4dc;border-radius:12px;padding:var(--space-2) var(--space-3);font-size:16px}
.yay{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;justify-content:space-between;background:#e2f8ec;border-radius:16px;padding:var(--space-3) var(--space-4);font-size:17px}
.yay strong{font-family:var(--display);font-weight:400;font-size:20px}
.yay-text{background:#e2f8ec;border-radius:14px;padding:var(--space-3) var(--space-4)}
.m-learn,.m-quiz,.m-comp,.m-color,.m-light,.m-tech,.m-paint{display:flex;flex-direction:column;gap:var(--space-4)}
.learn-row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
.learn-row .mini-p{width:200px;max-width:100%}
.learn-row > div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:var(--space-2);font-size:18px}
.mini-p{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tech3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.tech3 figure{margin:0;display:flex;flex-direction:column;gap:var(--space-1);text-align:center;font-weight:700}
.p-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
.p-opt{border:4px solid var(--line);background:#fff;border-radius:16px;padding:var(--space-2);cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2);font-weight:700;color:var(--ink)}
.p-opt.wrong{border-color:#ffb3a6;opacity:.6}.p-opt.right{border-color:var(--kelp);background:#e2f8ec}
.one-p{max-width:320px;margin:0 auto;width:100%}
.challenge{flex:none;line-height:1.5;background:#fff6d6;border-radius:16px;padding:var(--space-3) var(--space-4);font-size:17px}
.challenge.done{background:#e2f8ec}
.challenge .soft{display:inline-block;margin-top:var(--space-2)}
.table-area{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 3px #d9c7a8}
.wall{position:absolute;top:0;right:0;bottom:55%;left:0;background:linear-gradient(#f6ead2,#efdcbb)}
.tabletop{position:absolute;top:45%;right:0;bottom:0;left:0;background:linear-gradient(#c98b5a,#a8683c);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
.piece{position:absolute;transform:translate(-50%,-100%);cursor:grab;touch-action:none;border-radius:10px}
.piece-svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 4px rgba(60,30,10,.28))}
.piece.sel{outline:3px dashed #7b3fb0;outline-offset:2px}
.piece.focal .piece-svg{filter:drop-shadow(0 0 10px #fff2a8) drop-shadow(0 6px 4px rgba(60,30,10,.28))}
.piece-tools{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;background:#f4ecff;border-radius:16px;padding:var(--space-2)}
.piece-tools button{border:0;background:#fff;border-radius:12px;padding:var(--space-2) var(--space-3);font-weight:700;font-size:15px;min-height:42px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 #d8c6f2;min-width:44px}
.pt-name{font-family:var(--display);color:#7b3fb0;margin-right:var(--space-1)}
.obj-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:var(--space-2)}
.obj-pick button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:var(--space-2);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.observe{display:flex;flex-direction:column;gap:var(--space-2)}
.observe p{background:#eef8fa;border-radius:12px;padding:var(--space-2) var(--space-3);font-size:16px;display:flex;gap:var(--space-2);align-items:flex-start}
.concepts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.concepts button{border:2px solid #d8c6f2;background:#fff;border-radius:999px;padding:var(--space-2) var(--space-3);font-weight:700;font-size:14px;cursor:pointer;color:#5b3a9e}
.concepts button.on{background:#7b3fb0;color:#fff;border-color:#7b3fb0}
.concept-def{background:#f4ecff;border-radius:12px;padding:var(--space-3) var(--space-3)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4);align-items:start}
.pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:var(--space-2)}
.pot{border:2px solid var(--line);background:#fff;border-radius:16px;padding:var(--space-2);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);font-weight:700;cursor:pointer;color:var(--ink);font-size:15px}
.pot small{font-weight:400;color:var(--muted);font-size:12px}
.paint{width:46px;height:46px;border-radius:50% 50% 46% 54%/60% 60% 40% 40%;box-shadow:inset -5px -6px 0 rgba(0,0,0,.15)}
.palette-plate{background:#f3e6cf;border-radius:50% 46% 48% 52%;padding:var(--space-6);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center}
.blob{width:120px;height:110px;border-radius:52% 48% 55% 45%/50% 58% 42% 50%;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.1);transition:background .3s}
.drops{display:flex;gap:var(--space-1);flex-wrap:wrap;justify-content:center;min-height:14px}
.drops i{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1px solid rgba(0,0,0,.15)}
.mix-name{font-family:var(--display);font-size:20px}
.swatch{border:3px solid var(--line);background:#fff;border-radius:14px;padding:var(--space-2) var(--space-3);display:inline-flex;gap:var(--space-2);align-items:center;font-weight:700;cursor:pointer;color:var(--ink);font-size:17px}
.swatch i{width:24px;height:24px;border-radius:50%}
.swatch.sel{border-color:var(--sun);background:#fff6d6}.swatch.bad{border-color:var(--coral);animation:shake .4s}.swatch.good{border-color:var(--kelp)}
.mood-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.mood-btn{border:4px solid var(--line);border-radius:16px;background:#fff;padding:var(--space-2);cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2);font-weight:700;color:var(--ink)}
.mood-btn.on{border-color:#7b3fb0}
.mood{width:100%;height:auto;border-radius:10px;display:block}
.lit{width:100%;max-width:480px;height:auto;margin:0 auto;display:block;border-radius:16px}
.slider{display:flex;align-items:center;gap:var(--space-3);justify-content:center;font-weight:700;flex-wrap:wrap}
.slider input{width:min(320px,60vw);accent-color:#7b3fb0;height:32px}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--space-3)}
.tech-card{background:#fff;border-radius:16px;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);border:2px solid var(--line)}
.tech-card strong{font-family:var(--display);font-weight:400;font-size:18px}
.tech-card p{font-size:15px}
.tex{width:100%;height:auto;border-radius:10px;display:block}
.mcard.tex-card{flex-direction:column;padding:var(--space-2)}
.mcard.tex-card .tex{max-width:150px}
.mcard.tex-card small{font-size:13px}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3)}
.tmpl{border:4px solid var(--line);background:#fff;border-radius:16px;padding:var(--space-2);cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2);font-weight:700;color:var(--ink)}
.tmpl.on{border-color:#7b3fb0;box-shadow:0 0 0 3px #e7d8fb}
.tmpl-pic{aspect-ratio:4/3;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.tmpl-pic svg{width:100%;height:100%}
.blank-c{color:var(--muted);font-size:14px}
.bg-row{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.bg-btn{border:3px solid var(--line);background:#fff;border-radius:14px;padding:var(--space-2) var(--space-3);display:inline-flex;gap:var(--space-2);align-items:center;font-weight:700;cursor:pointer;color:var(--ink)}
.bg-btn i{width:30px;height:24px;border-radius:6px;border:1px solid #ddd}
.bg-btn.on{border-color:#7b3fb0}
.paint-top{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.chip-t{border:2px solid #d8c6f2;background:#fff;border-radius:999px;padding:var(--space-2) var(--space-3);font-weight:700;cursor:pointer;color:#5b3a9e}
.chip-t.on{background:#7b3fb0;color:#fff;border-color:#7b3fb0}
.canvas-wrap{position:relative}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;box-shadow:0 0 0 6px #8a5a33,0 0 0 9px #c9a35a;background:#fff}
.stage canvas,.stage .sketch-svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.cv-paint{touch-action:none;cursor:crosshair}
.sketch-svg{pointer-events:none}
.sketch-svg *{fill:none!important;stroke:#7d8b96!important;stroke-width:1.6px!important;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;opacity:.8}
.ref-card{position:absolute;right:8px;top:8px;z-index:3;width:min(32%,190px);background:#fff;border-radius:10px;padding:var(--space-1);box-shadow:0 4px 10px rgba(0,0,0,.25);pointer-events:none;text-align:center}
.ref-card > div{aspect-ratio:4/3;border-radius:6px;overflow:hidden}
.ref-card svg{width:100%;height:100%;display:block}
.ref-card small{font-weight:700;font-size:12px}
.toolbar{display:flex;flex-direction:column;gap:var(--space-3);background:#f7f1ff;border-radius:18px;padding:var(--space-3)}
.brushes{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.brushes button{border:2px solid #d8c6f2;background:#fff;border-radius:12px;padding:var(--space-2) var(--space-3);display:inline-flex;gap:var(--space-2);align-items:center;font-weight:700;cursor:pointer;min-height:44px;color:var(--ink)}
.brushes button.on{background:#7b3fb0;color:#fff;border-color:#7b3fb0}
.colors{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.cdot{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cbbbe6;cursor:pointer;display:grid;place-items:center}
.cdot small{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.cdot.on{box-shadow:0 0 0 4px #7b3fb0;transform:scale(1.1)}
.size-row{display:flex;gap:var(--space-3);align-items:center;font-weight:700}
.size-row input{flex:1;accent-color:#7b3fb0;height:32px}
.size-dot{border-radius:50%;display:inline-block;border:1px solid #ccc;flex:none}
.save-box input,.rename input{font-size:20px;padding:var(--space-3) var(--space-3);border-radius:12px;border:2px solid var(--line);font-family:var(--body);width:100%;box-sizing:border-box}
.saved-view{align-items:center;text-align:center}
.saved-img{width:100%;max-width:640px;border-radius:12px;box-shadow:0 0 0 6px #8a5a33,0 0 0 9px #c9a35a;-webkit-touch-callout:default}
.gal-head h2{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tip.light{color:#d8f4f7}
.empty-gal{align-items:center;text-align:center}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-4)}
.frame{margin:0;background:var(--pearl);border-radius:18px;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);box-shadow:0 6px 0 rgba(3,30,46,.28)}
.frame-wood{padding:var(--space-3);background:linear-gradient(135deg,#a8683c,#e1b06e,#8a5a33);border-radius:6px}
.frame-wood img{display:block;width:100%;border:4px solid #fffaf1}
.frame figcaption{display:flex;flex-direction:column;gap:var(--space-1);font-size:15px}
.frame strong{font-family:var(--display);font-weight:400;font-size:20px}
.objs{color:var(--muted)}
.seal{align-self:flex-start;border-radius:999px;padding:2px var(--space-3);font-weight:700;font-size:13px}
.seal.ok{background:#e2f8ec;color:#137a4e}.seal.tmp{background:#fff1d6;color:#9a6200}
.frame-btns{display:flex;gap:var(--space-2);flex-wrap:wrap}
.frame-btns button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:var(--space-2) var(--space-3);font-weight:700;cursor:pointer;color:var(--ink)}
.frame-btns .danger-t{border-color:var(--coral);color:#c9452f}
.rename{display:flex;gap:var(--space-2)}
@media (max-width:620px){.row-btns > .btn,.seq-ctrl > .btn{flex:1 1 140px}.seq-ctrl > .btn.lagoon{flex-basis:100%}.seq-ctrl{align-items:stretch}.seq-ctrl .bpm{flex:1 1 100%;order:-1}.grid-wrap::after{content:"Swipe to see all 8 beats →";display:block;font-size:13px;color:var(--muted);padding-top:var(--space-1)}}
@media (max-width:620px){.lab{grid-template-columns:1fr}.tech3{gap:var(--space-2)}.tech3 figcaption{font-size:14px}.studio-head{flex-direction:column!important;text-align:center}}

/* ===== The Tropical Orchestra ===== */
.music-entry{background:linear-gradient(120deg,#e0f7ff,#fff6d6)}
.music-entry .arrow{color:#0a6f8f}
.music-w .topbar .mute{margin-left:auto;font-size:24px}
.music-w .panel{display:flex;flex-direction:column;gap:var(--space-4)}
.m-start{align-items:center;text-align:center}
.m-start h1{color:#0a5f86;letter-spacing:1px}
.concert-stage{width:100%;height:auto;border-radius:18px;display:block}
.cs-bub circle{animation:rise 9s linear infinite}
.center-t{text-align:center;font-weight:700}
.mission.music{border-left-color:#1cc6c4}
.m-say{display:flex;gap:var(--space-3);align-items:center;text-align:left}
.m-say > svg{flex:none}
.m-bubble{background:#e6f8fb;border-radius:18px;padding:var(--space-3) var(--space-4);flex:1;min-width:0;font-size:19px}
.m-bubble b{font-family:var(--display);font-weight:400;color:#0a6f8f;font-size:15px;letter-spacing:.5px}
.mm{display:flex;flex-direction:column;gap:var(--space-4)}
.yay-big{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;justify-content:center;background:linear-gradient(120deg,#fff6d6,#e2f8ec);border-radius:22px;padding:var(--space-4);text-align:center}
.yay-big strong{font-family:var(--display);font-weight:400;font-size:26px;display:block}
.foods{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:center}
.food-card{border:3px solid var(--line);background:#fff;border-radius:18px;padding:var(--space-2) var(--space-3);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);font-weight:700;font-size:17px;cursor:pointer;min-width:86px;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.food-card .emo{font-size:40px;line-height:1}
.foods.small .food-card{min-width:70px;font-size:15px}.foods.small .emo{font-size:30px}
.food-card.sel{border-color:var(--sun);background:#fff6d6;transform:translateY(-3px)}
.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-3)}
.basket{--bc:#ccc;border:4px solid var(--bc);border-radius:18px 18px 34px 34px;background:#fff;min-height:110px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2);color:var(--ink);background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.03) 10px 20px)}
.basket strong{font-family:var(--display);font-weight:400;font-size:19px;color:var(--bc)}
.basket .in{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:28px}
.basket.ready{box-shadow:0 0 0 4px #fff6d6}
.basket.glow,.island.glow{animation:glowpulse .7s}
@keyframes glowpulse{0%{box-shadow:0 0 0 0 rgba(255,217,90,.9)}100%{box-shadow:0 0 0 18px rgba(255,217,90,0)}}
.song{display:flex;flex-direction:column;gap:var(--space-3)}
.lyrics{background:#fffdf6;border:3px solid #f1e3bf;border-radius:18px;padding:var(--space-3) var(--space-4);max-height:52vh;overflow:auto}
.lyrics h4{font-family:var(--display);font-weight:400;color:#0a6f8f;margin:var(--space-2) 0 2px;font-size:16px;text-transform:uppercase;letter-spacing:1px}
.lyric{font-size:21px;padding:var(--space-1) var(--space-3);border-radius:12px;transition:background .2s,transform .2s}
.lyric.now{background:#ffd95a;transform:scale(1.02);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.tabs button{border:2px solid #bfe3f1;background:#fff;border-radius:999px;padding:var(--space-2) var(--space-4);font-weight:700;cursor:pointer;color:var(--ink);min-height:44px}
.tabs button.on{background:#0a6f8f;color:#fff;border-color:#0a6f8f}
.clap,.follow,.create-r,.listen{display:flex;flex-direction:column;gap:var(--space-3);align-items:center;text-align:center}
.clap-word{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;justify-content:center}
.clap-word .emo{font-size:60px}
.clap-word strong{font-size:44px;letter-spacing:2px;display:flex;gap:var(--space-3)}
.syl{background:#e6f8fb;border-radius:12px;padding:0 var(--space-3)}.syl.lit{background:#ffd95a}
.big-drum{border:0;background:radial-gradient(circle,#fff6d6,#ffe3a3);border-radius:50%;padding:var(--space-5);cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 #e0b84a;transition:transform .06s}
.big-drum:active:not(:disabled){transform:scale(.94)}
.big-drum:disabled{opacity:.5}
.beat-dots{display:flex;gap:var(--space-3);min-height:28px}
.beat-dots i{width:24px;height:24px;border-radius:50%;background:#ff7058}
.beat-dots i.lit{background:#ffd95a;transform:scale(1.2)}
.pattern-row{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center}
.pbeat{width:66px;height:66px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-family:var(--display);border:3px solid transparent;cursor:default}
button.pbeat{cursor:pointer}
.pbeat.tap{background:#ff7058;color:#fff}.pbeat.rest{background:#e2eff2;color:#7d8b96}
.pbeat.lit{outline:5px solid #ffd95a;transform:scale(1.08)}
.pbeat.good{border-color:var(--kelp)}.pbeat.bad{border-color:#ff9a3c;box-shadow:0 0 0 3px #ffd2b0}
.countin{font-family:var(--display);font-size:28px;color:#0a6f8f}
.slot-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);width:100%;max-width:560px}
.r-slot{border:3px dashed #9fd3df;background:#f1fbfc;border-radius:16px;min-height:100px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.r-slot.on{border-style:solid;border-color:var(--lagoon);background:#fff}
.r-slot .emo{font-size:34px}
.mini-beats{display:flex;gap:3px}.mini-beats i{width:10px;height:10px;border-radius:50%;background:#e2eff2}.mini-beats i.on{background:#ff7058}.mini-beats i.lit{background:#ffd95a;transform:scale(1.4)}
.inst-pool{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:center}
.inst-card{border:3px solid var(--line);background:#fff;border-radius:18px;padding:var(--space-2);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);font-weight:700;cursor:pointer;min-width:100px;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.inst-card.big{min-width:140px}
.inst-card.sel{border-color:var(--sun);background:#fff6d6}
.inst-card.good{border-color:var(--kelp);background:#e2f8ec}.inst-card.bad{border-color:#ffb3a6;background:#fff1ee}
.islands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-3)}
.island{--ic:#ccc;border:0;border-radius:40% 40% 24px 24px/30% 30% 24px 24px;background:linear-gradient(#fff,#ffe9b8);box-shadow:0 0 0 4px var(--ic),0 8px 0 rgba(3,30,46,.2);padding:var(--space-5) var(--space-3) var(--space-3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);color:var(--ink);min-height:150px}
.island strong{font-family:var(--display);font-weight:400;font-size:21px;color:var(--ic)}
.island small{font-size:13px;color:var(--muted)}
.island .in{display:flex;flex-wrap:wrap;gap:var(--space-1);justify-content:center}
.mini-inst{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;gap:var(--space-2)}
.island.ready{box-shadow:0 0 0 6px var(--ic),0 8px 0 rgba(3,30,46,.2)}
.one-inst{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);font-size:22px}
.emo.huge{font-size:90px;line-height:1}
.fam-check{display:flex;gap:var(--space-3);justify-content:center;font-weight:700}
.fam-check .ok{color:var(--kelp)}
.seq{display:flex;flex-direction:column;gap:var(--space-3)}
.presets{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;font-weight:700}
.presets button{border:2px solid #bfe3f1;background:#fff;border-radius:999px;padding:var(--space-2) var(--space-3);font-weight:700;cursor:pointer;color:var(--ink)}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.seq-grid{display:flex;flex-direction:column;gap:var(--space-2);min-width:560px}
.seq-row{--rc:#ccc;display:grid;grid-template-columns:110px repeat(8,1fr);gap:var(--space-2);align-items:center}
.row-lab{display:flex;flex-direction:column;line-height:1.1;gap:var(--space-1)}
.row-lab strong{font-family:var(--display);font-weight:400;color:var(--rc);font-size:15px}
.row-lab small{font-size:12px;color:var(--muted)}
.cell{height:48px;border-radius:12px;border:3px solid var(--rc);background:#fff;cursor:pointer;transition:transform .08s}
.cell.down{background:#f6fbfc}
.cell.on{background:var(--rc)}
.cell.now{transform:scale(1.08);box-shadow:0 0 0 3px #ffd95a}
.seq-row.steps span{text-align:center;font-weight:700;color:var(--muted);border-radius:8px}
.seq-row.steps span.now{background:#ffd95a;color:var(--ink)}
.seq-ctrl{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;justify-content:center}
.bpm{font-weight:700;font-variant-numeric:tabular-nums;min-width:150px;text-align:center}
.concert-steps{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.concert-steps span{border-radius:999px;padding:var(--space-1) var(--space-3);font-weight:700;font-size:14px;background:#e2eff2;color:var(--muted)}
.concert-steps .now{background:#0a6f8f;color:#fff}.concert-steps .done{background:#c9f1db;color:#0d5b39}
.celebration{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--space-3);text-align:center;background:radial-gradient(circle at 50% 20%,#1aa9c6,#06324a);border-radius:22px;padding:var(--space-5);color:#fff;overflow:hidden}
.celebration h2,.celebration h3{color:#ffd95a}
.celebration .eyebrow{color:#bff3ff}
.celebration .m-bubble{color:var(--ink)}
.stage-lights{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;display:flex;justify-content:space-around}
.stage-lights i{width:60px;height:100%;background:linear-gradient(rgba(255,246,200,.45),transparent);transform-origin:top;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.dancers{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center;position:relative}
.dance{animation:bounce .6s ease-in-out infinite alternate}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.pad{--pc:#ccc;aspect-ratio:1;max-height:150px;border:0;border-radius:22px;background:var(--pc);color:#fff;font-family:var(--display);font-size:20px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:manipulation;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.pad.hit{transform:scale(.94);filter:brightness(1.25)}
.xylo{display:flex;gap:var(--space-2);align-items:center;height:240px;background:#8a5a33;border-radius:18px;padding:var(--space-3)}
.xylo .bar{flex:1;border:0;border-radius:10px;color:#fff;font-family:var(--display);font-size:20px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--space-2)}
.xylo .bar.hit{filter:brightness(1.3);transform:translateY(3px)}
.mara{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.mara-btn{border:0;background:#fff6d6;border-radius:30px;padding:var(--space-4);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:700;touch-action:manipulation}
.mara-btn.hit svg{animation:shake .2s}
.recbar{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;justify-content:center;background:#eef8fa;border-radius:16px;padding:var(--space-3)}
.rec-dot{color:#e8352b;font-weight:700;animation:glow 1s infinite}
.speedsel{font-weight:700}.speedsel select{font-size:16px;padding:var(--space-2);border-radius:8px}
.songs{display:flex;flex-direction:column;gap:var(--space-2)}
.song-item{display:flex;align-items:center;gap:var(--space-3);background:#fff;border:2px solid var(--line);border-radius:16px;padding:var(--space-2) var(--space-3);flex-wrap:wrap}
.song-item .emo{font-size:30px}
.song-item > div{flex:1;min-width:140px;display:flex;flex-direction:column;gap:var(--space-1)}
.song-item small{color:var(--muted)}
@media (max-width:620px){.pads{grid-template-columns:repeat(2,1fr)}.xylo{height:190px}.clap-word strong{font-size:32px}.pbeat{width:54px;height:54px}.m-bubble{font-size:17px}}
.map-sec{color:#fff;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2);margin-top:var(--space-4)}
.map-sec small{font-family:var(--body);font-size:15px;color:#d8f4f7;text-shadow:none}
.today-chip{display:flex;align-items:center;gap:var(--space-2);align-self:flex-start;background:rgba(255,255,255,.92);border-radius:999px;padding:var(--space-1) var(--space-2) var(--space-1) var(--space-3);font-weight:700;font-size:16px;flex-wrap:wrap}
.today-chip .emo{font-size:22px}
.today-chip button{border:0;background:var(--sun);border-radius:999px;padding:var(--space-2) var(--space-4);font-weight:700;cursor:pointer;min-height:40px;color:var(--ink)}
.speak,.concepts button,.presets button,.chip-t,.tabs button,.seg button,.frame-btns button,.piece-tools button{min-height:44px}
.slider input,.size-row input{height:44px}

/* Shared navigation + icon system */
.ico{flex:none;display:inline-block;vertical-align:middle}
.nav-btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:52px;padding:0 var(--space-4) 0 var(--space-3);border:0;border-radius:16px;background:var(--pearl);color:var(--sea);font-family:var(--display);font-size:18px;cursor:pointer;box-shadow:0 4px 0 rgba(3,30,46,.3);flex:none}

.medal small{font-weight:400;font-size:12px;color:var(--muted)}

.continue-cta strong{font-family:var(--display);font-weight:400;font-size:26px;display:block;line-height:1.1}
.continue-cta .eyebrow{color:#7a4a00}
.continue-cta .go-arrow{margin-left:auto;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#c98f00;flex:none}
.continue-cta:active{transform:translateY(3px);box-shadow:0 4px 0 #c98f00}
.world.got{background:#fffaea;box-shadow:0 6px 0 rgba(3,30,46,.28),inset 0 0 0 3px #e0a21c}
.w-top{min-height:84px}
.w-pearl{display:flex;flex:none}
.pearl-chip{display:inline-flex;align-items:center;gap:var(--space-1);align-self:flex-start;border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);font-weight:700;font-size:15px;line-height:1.2}
.pearl-chip.got{background:#1a7f45;color:#fff;box-shadow:0 2px 0 rgba(3,30,46,.2)}

/* ===================== SIZE SYSTEM =====================
   One scale for type, pictures, touch targets and counters. Component rules below
   consume these tokens; iPad (landscape/portrait) is the reference, phones step down. */
:root{
  --fs-display:34px; --fs-title:26px; --fs-prompt:22px; --fs-answer:24px; --fs-body:20px; --fs-small:17px; --fs-caption:16px;
  --pic-sm:34px; --pic-md:56px; --pic-lg:96px; --pic-xl:120px;
  --tap:56px; --tile-h:72px; --counter:34px; --cell:40px;
}
@media (max-width:520px){:root{
  --fs-display:28px; --fs-title:22px; --fs-prompt:19px; --fs-answer:20px; --fs-body:18px; --fs-small:15px; --fs-caption:15px;
  --pic-sm:28px; --pic-md:46px; --pic-lg:80px; --pic-xl:96px; --tile-h:62px; --counter:28px; --cell:32px;
}}
/* prompt + feedback */
.bubble{font-size:var(--fs-prompt)}
.tip{font-size:var(--fs-caption)}
.ask{font-size:var(--fs-title)}
.fb-msg p{font-size:var(--fs-small)}
/* answer cards: height follows content type, not a fixed box */
.opt{min-height:var(--tile-h);font-size:var(--fs-answer)}
.opts.list .opt{font-size:var(--fs-body);min-height:var(--tap)}
.opts.big .opt{font-size:calc(var(--fs-answer) * 1.6)}
.opt .emo{font-size:var(--pic-md)}
/* picture prompts */
.v-pic{font-size:var(--pic-xl)}
.v-missing .emo.big{font-size:var(--pic-lg)}
.v-quote .emo{font-size:var(--pic-md)}
.v-quote{font-size:calc(var(--fs-answer) + 2px)}
/* memory match: picture fills its card, letters read as letters */
.mcard{min-height:var(--tile-h);font-size:var(--fs-answer);gap:var(--space-2)}
.mcard.small{font-size:calc(var(--fs-small) + 1px);line-height:1.25}
.mcard .emo{font-size:var(--pic-sm)}
.mcard.pic{padding:var(--space-1)}
.mcard.pic .emo{font-size:var(--pic-md)}
.mcard.glyph{font-size:calc(var(--fs-answer) * 1.5)}
/* order / sort chips and slots */
.chip{min-height:var(--tap);font-size:var(--fs-body)}
.chip .emo{font-size:var(--pic-sm)}
.slot{min-height:64px;font-size:var(--fs-body)}
.bin{min-height:150px}
.bin h5{font-size:var(--fs-body)}
.bin-items .chip{font-size:var(--fs-small);min-height:48px}
/* spelling tiles */
.tile,.tk-syll .tile{height:64px;min-width:60px;font-size:calc(var(--fs-answer) + 4px)}
.tile.ghost{height:64px;min-width:60px}
/* math manipulatives: counters sized for counting with a finger */
.tenframe,.bundle .tenframe{grid-template-columns:repeat(5,var(--cell));grid-auto-rows:var(--cell)}
.bundle .tenframe{--cell:calc(var(--counter) * .85)}
.tenframe .cell{height:auto;border:0;border-radius:6px;background:#e6fbf8;cursor:default;transition:none}
.tenframe .cell svg{width:78%;height:78%}
.loose{gap:var(--space-2);max-width:760px}
.loose svg{width:var(--counter);height:var(--counter)}
.rod{grid-template-rows:repeat(10,16px);width:24px}
.v-rods.sm .rod{grid-template-rows:repeat(10,11px);width:17px}
.ones i{width:18px;height:18px}
.v-pattern svg{width:var(--pic-md);height:var(--pic-md)}
.v-nl{max-width:720px}
.nl-pt b{font-size:calc(var(--fs-answer) + 2px)}
.nl2{max-width:760px;height:110px}
.tick{width:44px;height:88px}
.tick b{font-size:var(--fs-small)}
.tick .mark{height:34px}
.dotgrid{width:min(100%,380px)}
/* containers: use the iPad landscape width instead of a fixed phone-like column */
@media (min-width:1100px){.screen{max-width:1000px}.screen.play{max-width:940px}}
/* module tiles share the same picture/label scale */
.food-card .emo{font-size:var(--pic-md)}
.obj-pick{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.obj-pick button{font-size:var(--fs-caption);min-height:96px}
.obj-pick button > svg{width:56px;height:56px}
.pot{font-size:var(--fs-caption)}
.pot small{font-size:13px}
.medal{font-size:15px}
.medal small{font-size:13px}
/* memory match: both columns share one row height so pairs line up */
.mcol{display:grid;grid-auto-rows:1fr}
/* number line: hit areas never overlap on narrow screens (11 ticks) */
@media (max-width:520px){.tick{width:26px}}
@media (max-width:520px){.opts.grid{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}}
@media (min-width:1100px){.worlds{grid-template-columns:repeat(3,1fr)}}
/* collectible creatures (official PNG) */
.creature-img{display:block;object-fit:contain;max-width:100%;height:auto;aspect-ratio:4/3}
.creature-img.locked{filter:brightness(0) opacity(.22)}
.aq-swim .creature-img{filter:drop-shadow(0 4px 4px rgba(3,30,46,.18))}
.aquarium{background:#5ccbe0 url("./assets/backgrounds/arrecife.jpg") center 70%/cover no-repeat}
/* creature reward card: one centered vertical stack, same frame for every creature */
.discover{width:100%;text-align:center}
.chest-img{display:block;object-fit:contain;margin:0 auto;transform:scale(.88);opacity:.85;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.chest-img.open{transform:scale(1);opacity:1}
.reward-stack{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);width:100%}
.reward-stack h3,.reward-stack p{margin:0;max-width:34ch}
.reward-stack .fact{overflow-wrap:anywhere}
.creature-frame{display:flex;align-items:center;justify-content:center;width:100%;height:170px;margin:var(--space-1) 0 var(--space-2)}
.creature-frame .creature-img{width:auto!important;height:auto!important;max-width:min(220px,100%)!important;max-height:100%;aspect-ratio:auto}
.fb-msg .chest-img{flex:none;margin:0}
@media (max-width:520px){.creature-frame{height:140px}}
/* Gallery: keep painting */
.continue-paint{align-self:stretch;min-height:56px;font-size:18px}
.continue-paint svg{flex:none}
.frame .edited{font-size:13px;color:var(--muted)}
.save-opts{flex-wrap:wrap}
.save-opts .btn{flex:1 1 180px}
.stage .cv-loading{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;background:rgba(255,250,241,.85);font-family:var(--display);font-size:24px;color:var(--sea);z-index:3}
/* 4:3 picture boxes — padding-based ratio with absolutely placed content.
   Root cause of the stretched still-life cards on iPad: a box sized only by aspect-ratio held an
   in-flow SVG with height:100% and no intrinsic size. Older Safari resolves that percentage before
   the ratio, so the grid row grew far past the content and the next blocks overlapped it.
   A padding box has a definite height in every engine, so the row is sized by real content. */
.tmpl-grid{align-items:start}
.tmpl{height:auto;min-width:0}
.tmpl-pic,.ref-card > div{position:relative;display:block;aspect-ratio:auto;height:0;padding-top:75%}
.tmpl-pic > svg,.ref-card > div > svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
.tmpl-pic > .blank-c{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;padding:var(--space-2);text-align:center}
.tmpl > span{line-height:1.2}
/* Same rule for the painting stage and the composition table (all their children are absolutely placed). */
.stage,.table-area{aspect-ratio:auto;height:0;padding-top:75%}
/* Collection/aquarium creatures: explicit box from the component, no aspect-ratio inside grid cards. */
.creature-img{aspect-ratio:auto}
/* Music pads: fixed responsive height instead of aspect-ratio inside the pads grid. */
.pad{aspect-ratio:auto;height:clamp(96px,18vw,150px)}
/* World → five missions */
.wm-head{display:flex;align-items:center;gap:var(--space-4);border-top:10px solid var(--wc)}
.wm-head.got{background:#fffaea;box-shadow:0 8px 0 rgba(3,30,46,.28),inset 0 0 0 3px #e0a21c}
.wm-head > svg{flex:none}
.wm-info{display:flex;flex-direction:column;gap:var(--space-2);flex:1;min-width:0}
.wm-info strong{font-family:var(--display);font-weight:400;font-size:var(--fs-title)}
.wm-info .bar i{background:var(--wc)}
.wm-info .pearl-chip{align-self:flex-start}
.mission-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)}
.mission-row{width:100%;display:flex;align-items:center;gap:var(--space-4);text-align:left;border:3px solid transparent;border-radius:var(--radius-card);background:var(--pearl);color:var(--ink);padding:var(--space-4);min-height:88px;cursor:pointer;box-shadow:0 6px 0 rgba(3,30,46,.28);font:inherit}
.mission-row .mr-num{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;background:var(--wc);color:#fff}
.mission-row .mr-text{display:flex;flex-direction:column;gap:var(--space-1);flex:1;min-width:0}
.mission-row .mr-kicker{font-size:var(--fs-caption);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mission-row strong{font-family:var(--display);font-weight:400;font-size:var(--fs-title);line-height:1.15}
.mission-row small{font-size:var(--fs-caption);color:var(--muted);line-height:1.3}
.mission-row .mr-state{flex:none;border-radius:var(--radius-pill);padding:var(--space-2) var(--space-3);font-weight:700;font-size:var(--fs-caption);background:#e6f3f6;color:var(--sea);text-align:center}
.mission-row.next{border-color:var(--sun);background:#fffbe8}
.mission-row .mr-state.next{background:var(--sun);color:var(--ink)}
.mission-row.done .mr-num{background:#1a7f45}
.mission-row .mr-state.done{background:#e2f8ec;color:#1a7f45}
.mission-row.locked{cursor:default;background:#eef3f5;box-shadow:none;border-color:transparent}
.mission-row.locked .mr-num{background:#b9c6cc;color:#fff}
.mission-row.locked strong,.mission-row.locked small{color:#6b7b84}
.mission-row .mr-state.locked{background:transparent;color:#5d6d76;border:2px dashed #a8b6bd}
.mission-tag{margin:0;color:var(--muted)}
.mission-tag b{color:var(--ink)}
@media (max-width:620px){.mission-row{flex-wrap:wrap;gap:var(--space-3)}.mission-row .mr-text{flex-basis:calc(100% - 70px)}.mission-row .mr-state{margin-left:64px}.wm-head{flex-wrap:wrap}.wm-head .w-pearl{display:none}}
/* ===== Art studio on iPad Safari ===== */
/* Still-life previews: the SVG carries its own 960×720 size, so it sizes itself in every browser
   (no aspect-ratio, no absolute positioning, no padding trick needed). */
.tmpl-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:stretch}
.tmpl > span{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.tmpl-pic{position:relative;height:auto;padding:0;aspect-ratio:auto;display:block;border:2px solid rgba(0,0,0,.06)}
.tmpl-pic > svg{position:static;display:block;width:100%;height:auto}
.tmpl.on .tmpl-pic{border-color:#7b3fb0}
.ref-card > div{position:relative;height:auto;padding:0;aspect-ratio:auto;display:block}
.ref-card > div > svg{position:static;display:block;width:100%;height:auto}
/* Painting workspace: canvas column sized from the visible height (--ws-h, set from JS) */
.paint-ws{display:flex;flex-direction:column;gap:var(--space-3)}
.paint-ws .canvas-wrap{width:100%;max-width:calc(var(--ws-h, 600px) * 4 / 3);margin:0 auto}
.stage,.cv-paint{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.paint-ws .toolbar{gap:var(--space-2)}
.paint-ws .save-box{display:flex;flex-direction:column;gap:var(--space-2);background:#fff;border-radius:14px;padding:var(--space-3);border:3px solid #7b3fb0}
/* iPad landscape and desktop: canvas left, compact tool panel right */
.paint-ws.side{display:grid;grid-template-columns:minmax(0,calc(var(--ws-h, 600px) * 4 / 3)) 280px;justify-content:center;align-items:start;gap:var(--space-4)}
.paint-ws.side .row-btns{position:-webkit-sticky;position:sticky;bottom:0;background:#f7f1ff;padding-top:var(--space-2);margin-top:auto;z-index:1}
.paint-ws.side .toolbar{display:flex;flex-direction:column}
.paint-ws.side .canvas-wrap{margin:0}
.paint-ws.side .toolbar{max-height:var(--ws-h, 600px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.paint-ws.side .brushes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-1)}
.paint-ws.side .brushes button{flex-direction:column;justify-content:center;gap:2px;padding:var(--space-1);font-size:13px;min-height:52px}
.paint-ws.side .colors{display:grid;grid-template-columns:repeat(5,40px);justify-content:space-between;row-gap:var(--space-2)}
.paint-ws.side .row-btns{display:grid;grid-template-columns:1fr;gap:var(--space-1)}
.paint-ws.side .row-btns .btn{padding:0 var(--space-1);font-size:13px;min-height:44px;line-height:1.1}
.paint-ws.side .row-btns .btn svg{display:none}
.paint-ws.side .size-row{gap:var(--space-2)}
.paint-ws.side .row-btns .btn.go{min-height:56px;font-size:18px}
.paint-ws.side .save-opts{display:flex;flex-direction:column}
/* Portrait tablets: compact toolbar under the canvas */
@media (max-width:899px), (orientation: portrait){
  .paint-ws .colors{gap:var(--space-2)}
  .paint-ws .row-btns{gap:var(--space-2)}
  .paint-ws .row-btns .btn{min-height:48px}
}
/* Five-segment mission progress */
.mseg{display:flex;flex-direction:column;gap:var(--space-1);width:100%}
.mseg-track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;height:14px}

.mseg-label{font-size:var(--fs-caption);color:var(--muted);line-height:1.2}

.modal-back{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(3,30,46,.55);display:flex;align-items:center;justify-content:center;padding:var(--space-4)}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clone = o => JSON.parse(JSON.stringify(o));

function O(v, label, extra) { return Object.assign({ v: String(v), label: label === undefined ? String(v) : label }, extra || {}); }
function mc(prompt, correct, distract, more) {
  more = more || {};
  const k = more.n || 3;
  const ds = uniq(distract.map(String)).filter(x => x !== String(correct));
  const all = shuffle([String(correct), ...sample(ds, k - 1)]);
  const q = Object.assign({ type: 'mc', prompt, options: all.map(x => O(x)), answer: String(correct) }, more);
  delete q.n; return q;
}
function yesno(prompt, yes, more, lang) {
  const Y = lang === 'es' ? 'Sí' : 'Yes', N = 'No';
  return Object.assign({ type: 'mc', prompt, options: [O(Y), O(N)], answer: yes ? Y : N, layout: 'grid' }, more || {});
}

function distinctFirst(pool, k) { const out = []; const seen = {}; for (const w of shuffle(pool)) { if (!seen[w[0]]) { seen[w[0]] = 1; out.push(w); } if (out.length === k) break; } return out; }
const abcSort = (arr, loc) => arr.slice().sort((a, b) => a.localeCompare(b, loc || 'en'));

function orderQ(prompt, words, loc, more) {
  const ans = abcSort(words, loc);
  return Object.assign({ type: 'order', prompt, items: shuffle(words).map(w => O(w)), answer: ans, explain: (loc === 'es' ? 'El orden correcto es: ' : 'The right order is: ') + ans.join(', ') + '.' }, more || {});
}

function validateDraw(target, pts) {
  const n = target === 'triangle' ? 3 : 4;
  if (pts.length !== n) return false;
  if (target === 'triangle') { const [a, b, c] = pts; return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]) !== 0; }

    const p = pts[(i + 3) % 4], q = pts[i], r = pts[(i + 1) % 4];
    const v1 = [p[0] - q[0], p[1] - q[1]], v2 = [r[0] - q[0], r[1] - q[1]];
    if (v1[0] * v2[0] + v1[1] * v2[1] !== 0) return false;
    if ((v1[0] === 0 && v1[1] === 0) || (v2[0] === 0 && v2[1] === 0)) return false;
  }
  if (target === 'square') { const d = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2; return d(pts[0], pts[1]) === d(pts[1], pts[2]); }

}

/* Focused confirmation: blocks the screen behind it, keeps focus inside, Escape = cancel. */
function ConfirmDialog({ title, text, cancelLabel, okLabel, onCancel, onOk, okClass = 'lagoon' }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement; const root = document.querySelector('.app > .screen');
    if (root) { root.setAttribute('inert', ''); root.setAttribute('aria-hidden', 'true'); }
    const b = ref.current && ref.current.querySelector('button'); b && b.focus();
    return () => { if (root) { root.removeAttribute('inert'); root.removeAttribute('aria-hidden'); } try { prev && prev.focus && prev.focus(); } catch (e) { } };
  }, []);
  const key = e => {
    if (e.key === 'Escape') { e.preventDefault(); onCancel(); return; }
    if (e.key !== 'Tab') return; const f = [...ref.current.querySelectorAll('button')]; if (!f.length) return;
    const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  };
  return ReactDOM.createPortal(html`<div className="modal-back app-modal" onClick=${e => { if (e.target === e.currentTarget) onCancel(); }}>
    <div className="panel modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t" ref=${ref} onKeyDown=${key}>
      <h3 id="dlg-t">${title}</h3>${text ? html`<p>${text}</p>` : null}
      <div className="row-btns"><button className="btn go" onClick=${onCancel}>${cancelLabel}</button><button className=${'btn ' + okClass} onClick=${onOk}>${okLabel}</button></div>
    </div></div>`, document.body);
}

const GRID = [0, 1, 2, 3, 4]; const gx = i => 30 + i * 50;

// Each world's host gives hints, explains and celebrates (Tuga in Reading, Lumi in the lighthouse...).
const isLighthouse = topicId => !!(TOPIC[topicId] && TOPIC[topicId].s === 'nat');

const tryMsg = (topicId, lang) => voiceOf(hostOfTopic(topicId), lang === 'es' ? 'es' : 'en', 'hint');
function Question({ q, guide, onFirst, onDone, onMiss, familyOk }) {
  const [tries, setTries] = useState(0); const [state, setState] = useState('open'); const [showHint, setShowHint] = useState(false); const [msg, setMsg] = useState(null);
  const firstRef = useRef(null); const familyRef = useRef(false); const stateRef = useRef('open'); const triesRef = useRef(0); const doneRef = useRef(false);
  const es = q.lang === 'es';
  const submit = ok => {
    if (stateRef.current !== 'open') return;
    if (firstRef.current === null) { firstRef.current = ok; onFirst(ok); }
    if (ok) {
      stateRef.current = 'right'; setState('right');
      let text = voiceOf(helperOf(q.topic), es ? 'es' : 'en', 'ok');
      if (firstRef.current === false && familyOk()) { text = '¡Los Aceves nunca se rinden!'; familyRef.current = true; }
      setMsg({ kind: 'right', text, sub: q.explain });
    } else {
      const t = triesRef.current + 1; triesRef.current = t; setTries(t);
      if (t >= 2) { stateRef.current = 'reveal'; setState('reveal'); setMsg({ kind: 'reveal', text: es ? 'Mira, así es:' : "Let's look together:", sub: q.explain }); }
      else { setShowHint(true); setMsg({ kind: 'try', text: tryMsg(q.topic, q.lang) }); }
    }
  };
  const miss = () => { if (firstRef.current === null) { firstRef.current = false; onFirst(false); } setShowHint(true); setMsg({ kind: 'try', text: tryMsg(q.topic, q.lang) }); onMiss && onMiss(); };
  const Body = { mc: MCQ, order: OrderQ, sort: SortQ, build: BuildQ, match: MatchQ, group: GroupQ, draw: DrawQ, line: LineQ }[q.type];
  const done = state !== 'open';
  return html`<div className="qwrap">
    ${q.finalMini ? html`<div className="final-banner"><${Starfish} size=${22}/> ${es ? 'Mini reto final' : 'Final mini challenge'} <${Starfish} size=${22}/></div>` : null}
    <div className="qhead"><div className="qguide"><${Guide} id=${guide} size=${92}/></div><div className="bubble"><p>${q.prompt}</p><div className="help-row"><${Speak} text=${q.tts || q.prompt} lang=${q.lang}/>${!done && !showHint && q.hint && q.level < 3 ? html`<button className="hint-btn" onClick=${() => { setShowHint(true); setMsg({ kind: 'try', text: es ? '¡Una pista!' : 'Here is a hint!' }); }}><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z" fill="#ffc531" stroke="#b07a00" strokeWidth="1.6"/><path d="M9.5 19h5M10.5 21.5h3" stroke="#0d6e86" strokeWidth="2" strokeLinecap="round"/></svg>${es ? 'Pista' : 'Hint'}</button>` : null}</div></div></div>
    <${Visual} v=${q.visual} lang=${q.lang}/>
    <div className="qbody"><${Body} q=${q} state=${state} submit=${submit} miss=${miss}/></div>
    <div className=${'feedback ' + (msg ? msg.kind : '')} aria-live="polite">
      ${msg ? html`<div className="fb-msg">${msg.kind === 'right' && q.chest ? html`<${Chest} open=${true} size=${70}/>` : msg.kind === 'right' ? html`<${Guide} id=${helperOf(q.topic)} size=${84} cls="bounce"/>` : html`<${Guide} id=${helperOf(q.topic)} size=${84}/>`}
        <div><strong>${msg.text}</strong>${msg.sub && msg.kind !== 'try' ? html`<p>${msg.sub}</p>` : null}${msg.kind === 'try' && showHint && q.hint ? html`<p>${q.hint}</p>` : null}</div></div>` : null}
      <div className="fb-btns">
        ${done ? html`<button className="btn go big" autoFocus onClick=${() => { if (doneRef.current) return; doneRef.current = true; onDone({ first: firstRef.current, retry: state === 'right' && firstRef.current === false, family: familyRef.current }); }}>${es ? 'Continuar' : 'Next'} ›</button>` : null}
      </div>
    </div>
  </div>`;
